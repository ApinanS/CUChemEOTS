<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHA Studio Simple · D-400</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--ink2:#374151;--mut:#6b7280;--line:#e5e7eb;--line2:#d1d5db;--bg:#f5f7fb;--card:#fff;
--blue:#2563eb;--blue-d:#1d4ed8;--blue2:#eaf1ff;--navy:#0f1f3d;--red:#dc2626;--green:#16a34a;--amber:#d97706;
--rk1:#dcfce7;--rk1b:#166534;--rk2:#fef9c3;--rk2b:#854d0e;--rk3:#ffedd5;--rk3b:#9a3412;--rk4:#fee2e2;--rk4b:#991b1b;
--r:12px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--sh2:0 12px 32px rgba(16,24,40,.18)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
/* ---------- app shell ---------- */
.topbar{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:0 0 auto}
.brand{font-weight:700;font-size:15.5px;white-space:nowrap}
.edpill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--blue2);color:var(--blue-d);margin-left:6px}
.edpill.full{background:#f3e8ff;color:#6d28d9}
.unitchip{display:flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--ink2);white-space:nowrap;max-width:330px;overflow:hidden;text-overflow:ellipsis}
.unitchip b{color:var(--ink)}
.save{font-size:12px;color:var(--mut);white-space:nowrap}
.sp{flex:1}
.seg{display:inline-flex;background:#f1f5f9;border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.tb{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.tb:hover{background:#f8fafc}
.tb.pri{background:var(--blue);border-color:var(--blue);color:#fff}.tb.pri:hover{background:var(--blue-d)}
.tb svg,.rail svg,.btn svg{width:16px;height:16px;flex:0 0 auto}
.tb.icon{width:34px;padding:0;justify-content:center}
.menu{position:relative}
.menu .dd{display:none;position:absolute;right:0;top:40px;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);padding:6px;z-index:40}
.menu.on .dd{display:block}
.dd button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.dd button:hover{background:#f1f5f9}.dd hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.dd .lab{font-size:11px;color:var(--mut);padding:4px 10px;text-transform:uppercase;letter-spacing:.5px}
.app{display:grid;grid-template-columns:212px 1fr;min-height:calc(100vh - 56px)}
.rail{position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow:auto;background:#fff;border-right:1px solid var(--line);padding:12px 10px}
.rail .grp{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:14px 8px 6px}
.rail .grp:first-child{margin-top:2px}
.rail button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink2);text-align:left;margin-bottom:2px}
.rail button:hover{background:#f1f5f9}
.rail button.on{background:var(--blue2);color:var(--blue-d);font-weight:600}
.rail .num{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:#eef2f7;color:var(--mut);flex:0 0 auto}
.rail button.on .num{background:var(--blue);color:#fff}
.rail .num.ok{background:#dcfce7;color:#166534}
.rail .badge{margin-left:auto;font-size:11px;background:#eef2f7;color:var(--mut);border-radius:999px;padding:0 7px}
.content{min-width:0;padding:18px 22px 40px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin-bottom:14px}
.pagehead h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.01em}
.pagehead .hint{font-size:13px;color:var(--mut);flex-basis:100%;margin-top:-4px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);width:100%}
.subtabs:empty{display:none}
.subtabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--blue-d);border-bottom-color:var(--blue);font-weight:600}
@media(max-width:900px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.rail .grp{display:none}.rail button{width:auto;white-space:nowrap;margin:0}.content{padding:12px}
 .unitchip,.save,.hide-s{display:none!important}.topbar{gap:6px;padding:0 8px}}
/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:17px;margin:0 0 8px;font-weight:650}h3{font-size:14.5px;margin:14px 0 6px;font-weight:650}
.mut{color:var(--mut)}.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2>*{min-width:0}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;color:var(--mut);margin-bottom:10px;font-weight:500}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--ink);font-weight:400}
label.f input:focus,label.f textarea:focus,label.f select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:9px;padding:6px 13px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{background:var(--blue-d)}
.btn.sec{background:#fff;color:var(--ink2);border-color:var(--line2)}.btn.sec:hover{background:#f8fafc}
.btn.warn{background:#fff;color:var(--red);border-color:#fecaca}.btn.warn:hover{background:#fef2f2}
.btn:disabled{opacity:.45;cursor:default}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tscroll{overflow-x:auto}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.t th,table.t td{border-bottom:1px solid var(--line);border-right:1px solid #f1f3f6;padding:7px 9px;vertical-align:top;text-align:left}
table.t th{background:#f8fafc;font-weight:600;color:var(--ink2);font-size:12.5px}
table.t tr:last-child td{border-bottom:0}
table.t input,table.t select,table.t textarea{width:100%;border:0;background:transparent;padding:2px;resize:vertical}
table.t input:focus,table.t textarea:focus,table.t select:focus{outline:2px solid #93c5fd;border-radius:4px;background:#f8fbff}
.risk{display:inline-block;min-width:58px;text-align:center;border-radius:999px;padding:2px 9px;font-weight:600;font-size:12px}
.rk1{background:var(--rk1);color:var(--rk1b)}.rk2{background:var(--rk2);color:var(--rk2b)}.rk3{background:var(--rk3);color:var(--rk3b)}.rk4{background:var(--rk4);color:var(--rk4b)}
.empty{padding:30px;text-align:center;color:var(--mut);border:2px dashed var(--line2);border-radius:var(--r);background:#fff}
.chip{display:inline-block;background:var(--blue2);color:var(--blue-d);border-radius:999px;padding:1px 8px;margin:2px;font-size:12px;font-weight:600;cursor:pointer}
.chip.pk{background:#fef3c7;color:#92400e}.chip.ots{background:#dcfce7;color:#166534}
.ok{color:var(--green);font-weight:600}.bad{color:var(--red);font-weight:600}
.status-Open{color:var(--red);font-weight:600}.status-Closed{color:var(--green);font-weight:600}
.cov td{text-align:center}.cov td.c0{color:#c0c4cb}.cov td.c1{background:#ecfdf3;font-weight:600}
.sev-E{color:var(--red);font-weight:700}.sev-W{color:var(--amber);font-weight:700}.sev-I{color:var(--blue);font-weight:700}
.bars{display:flex;gap:10px;flex-wrap:wrap}.bars div{flex:1;min-width:110px;border-radius:12px;padding:12px;text-align:center;font-size:12.5px}.bars b{display:block;font-size:24px}
table.rm{border-collapse:separate;border-spacing:3px}
table.rm td,table.rm th{width:72px;height:50px;text-align:center;font-size:13px;border-radius:8px}
table.rm th{background:#f1f5f9;font-size:12px;padding:3px}table.rm td{font-weight:700}table.rm td small{display:block;font-weight:400;font-size:11px;opacity:.75}
.imgbox{border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:#fff}.imgbox img{width:100%;display:block}
.steps{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.75}.steps .r{color:var(--blue-d);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mut)}
.stepcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.stepcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--sh);transition:.15s}.stepcard:hover{border-color:var(--blue);transform:translateY(-1px)}
.stepcard .n{width:26px;height:26px;border-radius:50%;background:var(--blue2);color:var(--blue-d);display:grid;place-items:center;font-weight:700;font-size:12.5px;margin-bottom:8px}
.stepcard b{display:block;margin-bottom:2px}.stepcard p{margin:0;font-size:12.5px;color:var(--mut)}
/* ---------- worksheet ---------- */
.ws{display:grid;grid-template-columns:236px 1fr;gap:14px;align-items:start}.ws>div{min-width:0}
@media(max-width:900px){.ws{grid-template-columns:1fr}}
.wsbar{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:12.5px;position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto;box-shadow:var(--sh)}
@media(max-width:900px){.wsbar{position:static;max-height:none}}
.wsbar .vrow{display:flex;gap:6px;align-items:center;margin:4px 0}.wsbar .vrow input:not([type]){flex:1;min-width:0;padding:4px 6px;border:1px solid var(--line2);border-radius:6px}
.wtabs{display:flex;gap:2px;margin:8px 0 6px;background:#f1f5f9;border-radius:8px;padding:2px}.wtabs button{flex:1;border:0;background:none;border-radius:6px;padding:4px 2px;cursor:pointer;font-size:12px;color:var(--mut);font-weight:600}.wtabs button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.wbox h4{margin:8px 0 3px;padding:3px 4px;font-size:11.5px;cursor:pointer;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.wbox .wbody{max-height:210px;overflow:auto}
.wsbar .it{padding:5px 8px;cursor:pointer;border-radius:7px;margin-bottom:1px}.wsbar .it:hover{background:#f1f5f9}.wsbar .it.on{background:var(--blue2);color:var(--blue-d);font-weight:600}
.wsbar .it .cnt{float:right;font-size:11px;color:var(--mut)}
.wlist{max-height:55vh;overflow:auto;margin-top:6px}
.banner{padding:10px 14px}.banner .bn{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:13px;padding:2px 0}.banner .bn b{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding-top:1px}.bt{cursor:pointer}
#wsWrap{border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
@media(min-width:900px){#wsWrap{max-height:calc(100vh - 230px);overflow:auto}#wsWrap thead{position:sticky;top:0;z-index:3}}
table.wsT{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;background:#fff}
table.wsT thead th{background:#1e3a8a;color:#fff;border-right:1px solid #3b5bb5;border-bottom:1px solid #3b5bb5;padding:6px;font-size:12px;font-weight:600;text-align:center}
table.wsT thead th.grp{background:#172f73}
table.wsT td{border-right:1px solid #eef1f5;border-bottom:1px solid var(--line);padding:0;vertical-align:top;background:#fff}
table.wsT tbody tr:hover td{background:#fafcff}
table.wsT textarea{width:100%;border:0;padding:6px;resize:none;min-height:54px;background:transparent;overflow:hidden;display:block;line-height:1.45}
table.wsT textarea:focus,table.wsT select:focus,table.wsT input:focus{outline:2px solid #93c5fd;background:#f8fbff}
table.wsT select{width:100%;border:0;padding:5px 2px;background:transparent}
table.wsT td.pad{padding:6px}
table.wsT td.dv .ref{font-weight:700;padding:6px 6px 0;color:var(--ink)}
table.wsT td.dv .pg{display:flex;gap:2px;padding:0 3px}table.wsT td.dv .pg select{font-size:11.5px;padding:2px 0;color:var(--blue-d);font-weight:600}
table.wsT input.num{width:100%;border:0;background:transparent;padding:5px;font-size:12.5px}
table.wsT td.rr{text-align:center;font-weight:700}
.cellbtn{display:block;width:100%;border:0;border-top:1px dashed #eef1f5;background:transparent;color:var(--blue);font-size:11.5px;padding:3px;cursor:pointer;text-align:left;padding-left:6px}
.cellbtn:hover{background:#f1f6ff}
.cellbtns{display:flex;flex-wrap:wrap;border-top:1px dashed #eef1f5}.cellbtns .cellbtn{border:0;width:auto;flex:1}
.rowact{display:flex;flex-direction:column;gap:3px;padding:4px}.rowact button{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:11.5px;padding:2px 4px}
.sgc{display:flex;gap:4px;align-items:flex-start;padding:4px 6px;border-bottom:1px solid #f1f3f6;font-size:12.5px}.sgc .sgt{flex:1}
.sgc.ipl{background:#ecfdf3}.sgc button{border:0;background:none;cursor:pointer;color:var(--mut);padding:0 2px}
.sgc.link .sgt:after{content:" ⛓";color:var(--mut);font-size:11px}
.sgl{display:grid;grid-template-columns:1fr 40px 74px;align-items:start;padding:0}.sgl>span{padding:4px 6px}.sgl .c{text-align:center;border-left:1px solid #f1f3f6}
.enl{display:grid;grid-template-columns:1fr 62px;border-bottom:1px solid #f1f3f6}.enl input{border:0;background:transparent;padding:5px;font-size:12px;min-width:0}.enl input.num{border-left:1px solid #f1f3f6}
.sr-r{background:#fca5a5!important;font-weight:600}.sr-g{background:#86efac!important;font-weight:600}.sr-y{background:#fde68a!important}
tr.flash td{animation:fl 1.2s}@keyframes fl{0%{background:#fde68a}100%{background:inherit}}
/* ---------- dialogs, drawer, toast ---------- */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(780px,96vw);background:#fff;z-index:60;box-shadow:var(--sh2);display:none;flex-direction:column}
.drawer.on{display:flex}.drawer .dh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.drawer .db{flex:1;overflow:auto}.drawer img{display:block}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:70;display:none;align-items:center;justify-content:center;padding:12px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh2)}
.mbox .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center}
.mbox .mb{padding:14px 18px;overflow:auto}.mbox .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pick{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pick div{padding:8px 12px;border-bottom:1px solid #f1f3f6;cursor:pointer}.pick div:hover{background:var(--blue2)}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 12px}.chk label{display:flex;gap:6px;align-items:center;font-size:13px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}.opt:has(input:checked){border-color:var(--blue);background:var(--blue2)}.opt b{display:block}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;display:none;align-items:center;gap:12px;box-shadow:var(--sh2);font-size:13px}
.toast button{background:none;border:0;color:#93c5fd;font-weight:700;cursor:pointer}
#repDoc{background:#fff;padding:24px 28px;border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
#repDoc h1{font-size:22px;margin:0 0 4px}#repDoc h2{margin-top:20px}#repDoc table.t{font-size:12px;margin-bottom:12px}
/* Full: Main page */
.welcome{display:grid;grid-template-columns:240px 1fr;gap:14px}@media(max-width:900px){.welcome{grid-template-columns:1fr}}
.welcome .wside{background:linear-gradient(160deg,#1e3a8a,#4c1d95);color:#e0e7ff;border-radius:var(--r);padding:16px;font-size:13px}.welcome .wside b{font-size:18px;color:#fff}
.tplbox{display:grid;grid-template-columns:200px 1fr;gap:12px}@media(max-width:600px){.tplbox{grid-template-columns:1fr}}
.tpll .it{padding:6px 10px;cursor:pointer;border-radius:8px}.tpll .it.on{background:var(--blue2);color:var(--blue-d);font-weight:600}.tpll .it.off{color:#9ca3af}
/* projector */
body.proj{font-size:17px}body.proj table.wsT{font-size:16px}body.proj .rail{display:none}body.proj .app{grid-template-columns:1fr}
@media print{.topbar,.rail,.noprint,.toast,.pagehead .subtabs{display:none!important}body{background:#fff}.app{display:block}.content{padding:0}#repDoc{border:0;padding:0}#repDoc h2{break-before:page}#repDoc h2.first{break-before:auto}}
.fac{position:fixed;inset:0;z-index:45;background:#0d1b2e;color:#eef3fa;display:none;flex-direction:column}.fac.on{display:flex}
.fach{display:flex;gap:10px;align-items:center;padding:10px 18px;background:#0f2d52;flex-wrap:wrap}
.fach select,.facclock select{background:#1c3a63;color:#fff;border:1px solid #3d5f8c;border-radius:6px;padding:4px 6px}
.fbs{background:#1c3a63;color:#fff;border:1px solid #3d5f8c;border-radius:6px;padding:5px 10px;cursor:pointer}
.facclock{display:flex;gap:6px;align-items:center;margin-left:8px}
#facClock{font:700 26px/1 ui-monospace,Consolas,monospace;min-width:92px;text-align:right}
#facClock.warn{color:#ffd08a}#facClock.over{color:#ff6b6b;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.facprog{display:flex;gap:10px;align-items:center;padding:6px 18px;font-size:13px;color:#b8c7dc}
.pbar{width:220px;height:8px;background:#22395b;border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;background:#4cc38a}
.facbody{flex:1;display:grid;grid-template-columns:1fr 340px;gap:16px;padding:8px 18px;overflow:auto}
@media(max-width:900px){.facbody{grid-template-columns:1fr}}
.facnode{border-left:8px solid;padding:4px 12px;font-size:22px;font-weight:700}
.facintent{font-size:15px;font-weight:400;color:#b8c7dc;margin-top:4px}
.facdev{background:#13284a;border-radius:12px;padding:14px 20px;margin:12px 0}
.facdev .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#8fa6c6;margin-top:6px}
.facdev .big{font-size:44px;font-weight:800;line-height:1.1}.facdev .gw{color:#ffc94d}
.gwmean{color:#b8c7dc;font-size:15px}
.facdev input{width:100%;font-size:22px;padding:6px 10px;border-radius:8px;border:1px solid #3d5f8c;background:#0d1b2e;color:#fff;margin-top:4px}
.facstate{margin-top:8px;font-size:15px}.facstate .ok{color:#7ee2a8}.facstate .nc{color:#b8c7dc}.facstate .open{color:#ffd08a}
.facbtns{display:flex;gap:10px;flex-wrap:wrap}
.fb{font-size:17px;padding:10px 16px;border-radius:8px;border:1px solid #3d5f8c;background:#1c3a63;color:#fff;cursor:pointer}.fb.pri{background:#ffc94d;color:#0f2d52;border-color:#ffc94d;font-weight:700}
.facgrid{margin-top:12px}.frow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0}
.fp{width:110px;font-weight:600;font-size:14px}
.chipg{border:1px solid #3d5f8c;background:transparent;color:#cfe0f5;border-radius:14px;padding:3px 9px;font-size:12px;cursor:pointer}
.chipg.row{background:#2e7d32;border-color:#2e7d32;color:#fff}.chipg.nc{background:#3a4a60;color:#cfd8e4}
.chipg.cur{outline:3px solid #ffc94d;outline-offset:1px}
.facrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;font-size:14px;background:#13284a;border-radius:10px;padding:10px 12px}
.facside{background:#13284a;border-radius:12px;padding:12px}
.facqr{background:#fff;border-radius:8px;padding:8px;margin-top:6px;color:#333}.facqr svg{width:100%;height:auto;display:block}
.qrurl{font-size:11px;word-break:break-all;color:#333;margin-top:4px}
.facinbox{max-height:44vh;overflow:auto}
.idea{background:#fff8d6;color:#2a2a2a;border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:14px}
.idea.used{opacity:.5}
.itype{font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;background:#dfe7f2}
.t-cause{background:#ffd8b0}.t-cons{background:#ffc9c9}.t-safe{background:#d9f2d9}.t-rec{background:#dce6f1}
.ibtn{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.ibtn button{font-size:11px;border:1px solid #c9b46a;background:#fff;border-radius:4px;cursor:pointer;padding:1px 5px}
.facmut{color:#8fa6c6}
/* phone page */
.ph{max-width:520px;margin:0 auto;padding:12px}
.phh{background:#0f2d52;color:#fff;padding:10px 12px;border-radius:10px;margin-bottom:10px}
.phnet{float:right;font-size:12px;color:#ffd08a}.phnet.ok{color:#7ee2a8}
.phstate{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.phnode{color:var(--mut);font-size:13px}.phdev{font-size:22px;margin:4px 0}.phdevt{font-size:15px}
.phtypes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.phtypes label{display:block}.phtypes input{display:none}
.phtypes span{display:block;text-align:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.phtypes input:checked+span{background:var(--blue);color:#fff;border-color:var(--blue)}
#phText{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.phnote{font-size:12px;color:var(--mut)}
.phidea{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:14px}
/* compare */
table.cmpT td{font-size:12px}
table.cmpT tr.miss td{background:#fff4f4}
.ci{margin-bottom:3px}.why{color:var(--mut);font-size:11px}
button.ov{border:0;background:none;cursor:pointer;padding:0 2px;font-size:14px}
.ck.y{color:#2e7d32;font-weight:700}.ck.n{color:var(--red);font-weight:700}
button.ov{border:0;background:none;cursor:pointer;padding:0 2px;font-size:14px}
.fac .facbody{min-height:0}.fac .facmain,.fac .facside{min-width:0}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){const enc=new TextEncoder();const parts=[],cent=[];let off=0;
 files.forEach(([name,str])=>{const nb=enc.encode(name),db=enc.encode(str),crc=crc32(db);
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint32(14,crc,true);lh.setUint32(18,db.length,true);lh.setUint32(22,db.length,true);lh.setUint16(26,nb.length,true);
  parts.push(new Uint8Array(lh.buffer),nb,db);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint32(16,crc,true);ch.setUint32(20,db.length,true);ch.setUint32(24,db.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
  cent.push(new Uint8Array(ch.buffer),nb);off+=30+nb.length+db.length;});
 const csize=cent.reduce((s,a)=>s+a.length,0);const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csize,true);end.setUint32(16,off,true);
 return new Blob([...parts,...cent,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}

 ${ST.groups.length?`<div class="tscroll"><table class="t"><tr><th>ID</th><th style="width:22%">Group</th><th>Description</th><th style="width:110px">Tolerance (/yr)</th><th>Scenarios</th><th>Σ f<sub>mitigated</sub></th><th>Result</th><th></th></tr>${ST.groups.map(g=>{const c=groupCalc(g);return `<tr data-g="${g.id}" style="${g.id===UI.gsel?'background:#fffbe6':''}"><td><a href="#" data-sel="${g.id}"><b>${g.id}</b></a></td><td><input data-k="name" value="${esc(g.name)}"></td><td><input data-k="desc" value="${esc(g.desc)}"></td><td><input data-k="tol" value="${esc(g.tol)}"></td><td>${c.mem.length}${c.inc?` <span class="small mut">(${c.inc} not in LOPA)</span>`:''}</td><td>${c.n?fmt(c.sum):'–'}</td><td>${c.meets==null?'–':c.meets?'<span class="ok">Meets</span>':'<span class="bad">Exceeds ×'+fmt(c.sum/c.tol)+'</span>'}</td><td><button class="btn warn" data-del="${g.id}">✕</button></td></tr>`;}).join('')}</table></div>`:'<div class="empty">No scenario group yet.</div>'}</div>

 $('#gAdd').onclick=()=>{const id='G'+(++ST.gseq);ST.groups.push({id,name:'New group',desc:'',tol:'1e-5'});UI.gsel=id;dirty();rGroups();};
 m.querySelectorAll('tr[data-g]').forEach(tr=>{const g=ST.groups.find(x=>x.id===tr.dataset.g);tr.querySelectorAll('[data-k]').forEach(e=>{e.oninput=()=>{g[e.dataset.k]=e.value;dirty();};e.onchange=()=>rGroups();});});

 box.querySelectorAll('[data-r]').forEach(c=>c.onchange=()=>{const x=findRow(c.dataset.r);if(!x)return;x.r.grp=x.r.grp.filter(i=>i!==g.id);if(c.checked)x.r.grp.push(g.id);dirty();rGroups();});}

/* ================= LOPA ================= */
function lopaDialog(r){const L=r.lopa;const ref=refOf(r.id);
 const draw=()=>{const c=lopaCalc(r);const li=(arr,k,lib,lab,ph)=>arr.map((x,i)=>`<tr><td><input data-a="${k}" data-i="${i}" data-f="d" value="${esc(x.d)}" placeholder="${ph}"></td><td style="width:90px"><input data-a="${k}" data-i="${i}" data-f="${k==='ie'?'f':'p'}" value="${esc(k==='ie'?x.f:x.p)}"></td><td style="width:34px"><button class="btn warn" data-rm="${k}:${i}">✕</button></td></tr>`).join('');
  const body=`<p class="small mut">Row <b>${ref}</b> · ${esc(r.dev||'')} · S = ${r.S||'?'}. Frequencies are per year; probabilities are between 0 and 1. Values in the libraries are typical teaching values: replace them with your own data in <b>Settings</b>.</p>
  <h3 style="margin-top:0">Consequence</h3><div class="small">${nl2br(r.cons)||'<span class="mut">(none written)</span>'}</div>
  <h3>Initiating events (cause and frequency per year)</h3><table class="t">${li(L.ie,'ie','', '', 'cause')}</table>
  <div class="toolbar"><select id="ieLib"><option value="">+ from the library…</option>${ST.set.ie.map((x,i)=>`<option value="${i}">${esc(x[0])} · ${x[1]}/yr</option>`).join('')}</select><button class="btn sec" id="ieAdd">+ own</button></div>
  <h3>Enabling events or conditions (probability)</h3><table class="t">${li(L.en,'en','','','e.g. only during a pack change')}</table><div class="toolbar"><button class="btn sec" id="enAdd">+ Enabling condition</button></div>
  <h3>Conditional modifiers (probability)</h3><table class="t">${li(L.cm,'cm','','','e.g. ignition, occupancy')}</table><div class="toolbar"><select id="cmLib"><option value="">+ from the library…</option>${ST.set.cm.map((x,i)=>`<option value="${i}">${esc(x[0])} · ${x[1]}</option>`).join('')}</select><button class="btn sec" id="cmAdd">+ own</button></div>
  <h3>Independent protection layers (from the safeguards of this row)</h3>${r.sg.length?`<table class="t"><tr><th style="width:34px">IPL</th><th>Safeguard</th><th style="width:90px">PFD</th></tr>${r.sg.map(id=>{const s=sgById(id);return s?`<tr><td><input type="checkbox" data-ipl="${id}"${L.ipl.includes(id)?' checked':''}></td><td>${esc(s.text)}</td><td>${s.pfd?fmt(num(s.pfd)):'<a href="#" data-sgp="'+id+'">set</a>'}</td></tr>`:'';}).join('')}</table>`:'<div class="small mut">This row has no safeguards yet.</div>'}
  <p class="small mut">An IPL must be independent of the initiating event and of the other IPLs, specific to the scenario, dependable and auditable. Tick only the safeguards that pass these tests.</p>
  <h3>Calculation, step by step</h3><div class="steps">${stepsHtml(r,c)}</div>`;
  $('#mBody').innerHTML=body;
  $$('#mBody input[data-a]').forEach(e=>e.oninput=()=>{L[e.dataset.a][+e.dataset.i][e.dataset.f]=e.value;dirty();upd();});
  $$('#mBody [data-rm]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.rm.split(':');L[k].splice(+i,1);dirty();draw();});
  $$('#mBody input[data-ipl]').forEach(c=>c.onchange=()=>{const id=c.dataset.ipl;if(c.checked){if(!L.ipl.includes(id))L.ipl.push(id);}else L.ipl=L.ipl.filter(x=>x!==id);dirty();draw();});
  $$('#mBody [data-sgp]').forEach(a=>a.onclick=e=>{e.preventDefault();closeModal();sgDialog(a.dataset.sgp,r);});
  $('#ieLib').onchange=e=>{if(e.target.value==='')return;const x=ST.set.ie[+e.target.value];L.ie.push({d:x[0],f:String(x[1])});dirty();draw();};
  $('#ieAdd').onclick=()=>{L.ie.push({d:'',f:''});dirty();draw();};$('#enAdd').onclick=()=>{L.en.push({d:'',p:'1'});dirty();draw();};
  $('#cmLib').onchange=e=>{if(e.target.value==='')return;const x=ST.set.cm[+e.target.value];L.cm.push({d:x[0],p:String(x[1])});dirty();draw();};$('#cmAdd').onclick=()=>{L.cm.push({d:'',p:'1'});dirty();draw();};};
 const upd=()=>{const el=$('#mBody .steps');if(el)el.innerHTML=stepsHtml(r,lopaCalc(r));};
 modal('LOPA scenario '+ref,'',[['Remove from LOPA','warn',()=>{L.on=false;closeModal();dirty();refreshLopaViews();}],['Done','',()=>{L.on=true;closeModal();dirty();refreshLopaViews();}]]);draw();}
function refreshLopaViews(){if(UI.tab==='ws')drawTable();else show(UI.tab);}
function stepsHtml(r,c){const T=r.S?fmt(num(ST.set.tel[r.S])):'?';const L=r.lopa;
 const ie=L.ie.map(x=>fmt(num(x.f))).join(' + ')||'0';
 let h=`1. f<sub>IE</sub> = Σ initiating-event frequencies = ${ie} = <span class="r">${fmt(c.fIE)}</span> per year<br>`;
 h+=`2. P<sub>enabling</sub> = Π enabling probabilities = ${L.en.map(x=>fmt(num(x.p))).join(' × ')||'1'} = <span class="r">${fmt(c.pEN)}</span><br>`;
 h+=`3. P<sub>modifiers</sub> = Π conditional modifiers = ${L.cm.map(x=>fmt(num(x.p))).join(' × ')||'1'} = <span class="r">${fmt(c.pCM)}</span><br>`;
 h+=`4. f<sub>unmitigated</sub> = f<sub>IE</sub> × P<sub>enabling</sub> × P<sub>modifiers</sub> = ${fmt(c.fIE)} × ${fmt(c.pEN)} × ${fmt(c.pCM)} = <span class="r">${fmt(c.fU)}</span> per year<br>`;
 h+=`5. Π PFD of the IPLs = ${c.ipls.map(x=>isNaN(x.pfd)?'?':fmt(x.pfd)).join(' × ')||'1 (no IPL)'} = <span class="r">${fmt(c.pPFD)}</span>${c.bad.length?' <span class="bad">(PFD missing for '+c.bad.length+' IPL)</span>':''}<br>`;
 h+=`6. f<sub>mitigated</sub> = f<sub>unmitigated</sub> × Π PFD = ${fmt(c.fU)} × ${fmt(c.pPFD)} = <span class="r">${fmt(c.fM)}</span> per year<br>`;
 h+=`7. Tolerable event likelihood for S = ${r.S||'?'}: TEL = <span class="r">${T}</span> per year<br>`;
 if(c.hasS){h+=`8. Total reduction the IPLs must give = f<sub>unmitigated</sub> ÷ TEL = ${fmt(c.fU)} ÷ ${fmt(c.tel)} = <span class="r">${fmt(c.need)}</span><br>`;
  h+=`9. ${c.meets?`f<sub>mitigated</sub> ≤ TEL (${fmt(c.fM)} ≤ ${fmt(c.tel)}): <span class="ok">the existing IPLs are enough · RRR = RRF = None</span>`:`f<sub>mitigated</sub> > TEL: <span class="bad">RRF = f<sub>mitigated</sub> ÷ TEL = ${fmt(c.fM)} ÷ ${fmt(c.tel)} = ${fmt(c.rrf)}</span> (risk reduction still missing); RRR = TEL ÷ f<sub>mitigated</sub> = <span class="r">${fmt(c.rrr)}</span>, the PFD an additional IPL must reach`}`;}
 else h+='8. Choose S in the worksheet row to compare with the TEL.';return h;}
function rLopa(sub){const m=$('#main');const sc=allRows().filter(x=>x.r.lopa.on);
 if(sub==='ipl'){const map={};sc.forEach(x=>{const c=lopaCalc(x.r);x.r.lopa.ipl.forEach(id=>{const s=sgById(id);if(!s)return;(map[id]=map[id]||{s,rows:[],sev:new Set(),ie:new Set()}).rows.push(x.ref);map[id].sev.add(x.r.S);x.r.lopa.ie.forEach(i=>i.d&&map[id].ie.add(i.d));});});

function cnt(s){return String(s||'').split('\n').map(x=>x.trim()).filter(Boolean).length;}
function rAna(){const m=$('#main'),rs=allRows();
 const per=U.nodes.map(n=>{const a=rowsOf(n.id);const b={Low:0,Medium:0,High:0,'Very high':0,none:0};a.forEach(r=>{const k=riskOf(r.S,r.L);b[k?k.band:'none']++;});return {n,rows:a.length,causes:a.reduce((s,r)=>s+cnt(r.causes),0),cons:a.reduce((s,r)=>s+cnt(r.cons),0),sg:a.reduce((s,r)=>s+r.sg.length,0),ipl:a.reduce((s,r)=>s+r.lopa.ipl.length,0),lp:a.filter(r=>r.lopa.on).length,recs:new Set(a.flatMap(r=>r.recs)).size,b};});
 const tot=k=>per.reduce((s,x)=>s+x[k],0);const bt={};BANDS.concat('none').forEach(b=>bt[b]=per.reduce((s,x)=>s+x.b[b],0));
 const cats={};rs.forEach(x=>cats[x.r.cat]=(cats[x.r.cat]||0)+1);
 const colors={'Low':'#9bd49b','Medium':'#f3d560','High':'#f2a65a','Very high':'#e57373',none:'#cfd6df'};
 const mx=Math.max(1,...per.map(x=>x.rows));
 const bar=per.map((x,i)=>{let y=0;const w=x.rows/mx*300;let s='';BANDS.concat('none').forEach(b=>{const ww=x.b[b]/mx*300;if(ww){s+=`<rect x="${60+y}" y="${6+i*26}" width="${ww}" height="18" fill="${colors[b]}"><title>${x.n.id} ${b}: ${x.b[b]}</title></rect>`;y+=ww;}});return `<text x="4" y="${20+i*26}" font-size="12">${x.n.id}</text>${s}<text x="${66+y}" y="${20+i*26}" font-size="12">${x.rows}</text>`;}).join('');
 const catKeys=Object.keys(cats);const totC=rs.length||1;let ang=-Math.PI/2;const pal=['#1f5fa8','#2e7d32','#b45309','#8e24aa'];
 const pie=catKeys.map((k,i)=>{const a=cats[k]/totC*2*Math.PI;const x1=100+80*Math.cos(ang),y1=100+80*Math.sin(ang);ang+=a;const x2=100+80*Math.cos(ang),y2=100+80*Math.sin(ang);return cats[k]===totC?`<circle cx="100" cy="100" r="80" fill="${pal[i%4]}"/>`:`<path d="M100 100 L${x1} ${y1} A80 80 0 ${a>Math.PI?1:0} 1 ${x2} ${y2} Z" fill="${pal[i%4]}"><title>${k}: ${cats[k]}</title></path>`;}).join('');
 m.innerHTML=`<div class="card"><h2>Analysis: worksheet entry counts</h2><div class="tscroll"><table class="t"><tr><th>Node</th><th>Rows</th><th>Causes</th><th>Consequences</th><th>Safeguards</th><th>IPLs credited</th><th>LOPA scenarios</th><th>Recommendations</th></tr>${per.map(x=>`<tr><td><b>${x.n.id}</b> ${esc(x.n.name)}</td><td>${x.rows}</td><td>${x.causes}</td><td>${x.cons}</td><td>${x.sg}</td><td>${x.ipl}</td><td>${x.lp}</td><td>${x.recs}</td></tr>`).join('')}<tr><th>All nodes</th><th>${tot('rows')}</th><th>${tot('causes')}</th><th>${tot('cons')}</th><th>${tot('sg')}</th><th>${tot('ipl')}</th><th>${tot('lp')}</th><th>${ST.recs.length}</th></tr></table></div></div>
 <div class="grid2"><div class="card"><h3 style="margin-top:0">Risk of the rows, by node</h3><svg viewBox="0 0 420 ${per.length*26+12}" width="100%" role="img" aria-label="Rows per node by risk band">${bar}</svg><div class="small">${BANDS.concat('none').map(b=>`<span style="display:inline-block;width:11px;height:11px;background:${colors[b]};margin-right:3px"></span>${b==='none'?'not ranked':b} (${bt[b]})&nbsp;&nbsp;`).join('')}</div></div>
 <div class="card"><h3 style="margin-top:0">Consequence category of the rows</h3><svg viewBox="0 0 200 200" width="220" role="img" aria-label="Consequence categories">${rs.length?pie:''}</svg><div class="small">${catKeys.map((k,i)=>`<span style="display:inline-block;width:11px;height:11px;background:${pal[i%4]};margin-right:3px"></span>${k} (${cats[k]})&nbsp;&nbsp;`).join('')}</div></div></div>
 <div class="grid2"><div class="card"><h3 style="margin-top:0">Risk matrix (rows per cell)</h3><div class="tscroll" id="rmWrap"></div></div><div class="card"><h3 style="margin-top:0">Levels and the action they need</h3><div class="bars" id="bars"></div><table class="t" style="margin-top:8px"><tr><th>Level</th><th>S × L</th><th>Action</th></tr>${levelText().map((l,i)=>`<tr><td><span class="risk ${BCLS[l[0]]}">${l[0]}</span></td><td>${l[1]}</td><td>${esc(U.level[i][2])}</td></tr>`).join('')}</table></div></div>`;
 const cell={};rs.forEach(x=>{const rk=riskOf(x.r.S,x.r.L);if(rk)cell[x.r.S+','+x.r.L]=(cell[x.r.S+','+x.r.L]||0)+1;});
 let h='<table class="rm"><tr><th>S \\ L</th>'+ST.set.L.map(l=>`<th>${l[0]}<br><span class="small">${esc(l[1])}</span></th>`).join('')+'</tr>';
 for(let s=5;s>=1;s--){h+=`<tr><th>${s}<br><span class="small">${esc(ST.set.S[s-1][1])}</span></th>`;for(let l=1;l<=5;l++){const rk=riskOf(s,l);h+=`<td class="${rk.cls}">${cell[s+','+l]||''}<small>${rk.R}</small></td>`;}h+='</tr>';}
 $('#rmWrap').innerHTML=h+'</table>';
 $('#bars').innerHTML=BANDS.map(b=>`<div class="${BCLS[b]}"><b>${bt[b]}</b>${b}</div>`).join('')+`<div style="background:#eef2f7"><b>${bt.none}</b>not ranked</div>`;}
/* ================= DATA CHECK ================= */
function checks(){const out=[];const add=(sev,ref,msg,node,rid)=>out.push({sev,ref,msg,node,rid});
 U.nodes.forEach(n=>{if(!rowsOf(n.id).length)add('I',n.id,'No rows recorded for this node',n.id);});
 allRows().forEach(x=>{const r=x.r,rk=riskOf(r.S,r.L),g=(s,m)=>add(s,x.ref,m,x.node,r.id);
  if(!r.dev.trim())g('E','Deviation is empty');
  if(r.dev.trim()&&!cnt(r.causes))g('E','No cause recorded');
  if(r.dev.trim()&&!cnt(r.cons))g('E','No consequence recorded');
  if(cnt(r.cons)&&!r.S)g('W','Severity (S) is not chosen');
  if(cnt(r.cons)&&!r.L)g('W','Likelihood (L) is not chosen');
  if(rk&&rk.R>ST.set.cut[0]&&!r.sg.length)g('W','Risk above Low and no safeguard recorded');
  if(rk&&(rk.band==='High'||rk.band==='Very high')&&!r.recs.length&&!r.lopa.on)g('E','High risk with no recommendation and no LOPA');
  if(r.lopa.on){const c=lopaCalc(r);if(!c.nIE)g('E','LOPA: no initiating event with a frequency');else if(!c.hasS)g('E','LOPA: severity is missing, so TEL is unknown');
   if(c.bad&&c.bad.length)g('E','LOPA: an IPL has no PFD');if(r.lopa.ipl.length&&r.lopa.ipl.some(id=>!sgById(id)))g('E','LOPA: an IPL points to a deleted safeguard');
   if(c.ok&&!c.meets&&!r.recs.length)g('W','LOPA gap of ×'+fmt(c.gap)+' and no recommendation raised');
   if(c.ok&&c.meets&&c.need>1&&c.pPFD>=1)g('I','LOPA meets TEL with no IPL credited: check the TEL or the frequency');}
  r.lopa.ipl.forEach(id=>{if(!r.sg.includes(id))g('W','An IPL is not among the safeguards of the row');});});
 ST.recs.forEach(r=>{if(!r.text.trim())add('E',r.id,'Recommendation text is empty');if(!r.by)add('W',r.id,'No one is named to act');if(recUse(r.id)===0)add('I',r.id,'Not linked to any row');if(r.status!=='Closed'&&!r.due)add('I',r.id,'No due date');});
 ST.park.filter(p=>p.status==='Open').forEach(p=>add('W',p.id,'Parking-lot item is still open: '+p.text.slice(0,70)));
 ST.sg.forEach(s=>{if(sgUse(s.id)===0)add('I',s.id,'Safeguard is in the master list but not used');});
 return out;}

 m.innerHTML=`<div class="card"><h2>Data check</h2><div class="bars"><div style="background:#ffe1e1"><b>${n.E}</b>Errors</div><div style="background:#fff0d6"><b>${n.W}</b>Warnings</div><div style="background:#e5eef9"><b>${n.I}</b>Notes</div></div>
 <p class="small mut">Run this before you hand in or print the report. Errors stop the study from being complete; warnings are likely omissions; notes are for the team to judge.</p>`+(ch.length?`<div class="tscroll"><table class="t"><tr><th>Level</th><th>Where</th><th>Finding</th><th></th></tr>${ch.map(c=>`<tr><td class="sev-${c.sev}">${{E:'Error',W:'Warning',I:'Note'}[c.sev]}</td><td>${esc(c.ref)}</td><td>${esc(c.msg)}</td><td>${c.node?`<button class="btn sec" data-n="${c.node}" data-r="${c.rid||''}">Go</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty">No findings. The study passes every check.</div>')+'</div>';

 const T=(rows,head)=>`<table class="t"><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;

 h+=`<h3>Protocol</h3><p>${nl2br(ST.meta.protocol)}</p><h3>Risk criteria</h3><p> Risk = S × L: ${levelText().map(l=>l[0]+' '+l[1]).join(', ')}. S is judged without credit for safeguards and L with the existing safeguards. LOPA follows the CCPS method: f<sub>mitigated</sub> = f<sub>IE</sub> × P<sub>enabling</sub> × P<sub>modifiers</sub> × Π PFD, compared with the tolerable event likelihood (TEL) for the severity.</p>`;
 let n=2;U.nodes.forEach(nd=>{const a=rowsOf(nd.id);if(!a.length)return;
  h+=`<h2>${n++}. Node ${nd.id}: ${esc(nd.name)}</h2><p><b>Design intent:</b> ${esc(nd.intent)}<br><b>Equipment:</b> ${esc(nd.equip)}<br><b>Instruments:</b> ${esc(nd.inst)}<br><b>Drawings:</b> ${esc(nd.dwg)}</p>`;
  h+=T(a.map((r,i)=>{const rk=riskOf(r.S,r.L);return [nd.id+'.'+(i+1),esc(r.dev),nl2br(r.causes),nl2br(r.events),nl2br(r.cons),esc(r.cat),esc(r.S),r.sg.map(id=>esc((sgById(id)||{}).text||'')).join('<br>'),esc(r.L),rk?rk.band+' '+rk.R:'',r.recs.join(', ')];}),['Ref','Deviation','Causes','Events','Consequences','Cat','S','Safeguards','L','Risk','Rec.']);});
 const lp=rs.filter(x=>x.r.lopa.on);
 if(lp.length){h+=`<h2>${n++}. LOPA scenarios</h2>`+T(lp.map(x=>{const r=x.r,c=lopaCalc(r);return [x.ref,nl2br(r.cons),esc(r.S),c.hasS?fmt(c.tel):'–',r.lopa.ie.map(i=>esc(i.d)+' '+fmt(num(i.f))).join('<br>'),[...r.lopa.en.map(i=>esc(i.d)+' '+fmt(num(i.p))),...r.lopa.cm.map(i=>esc(i.d)+' '+fmt(num(i.p)))].join('<br>'),c.ipls.map(i=>esc(i.s.tag||i.s.text.slice(0,30))+' '+(isNaN(i.pfd)?'?':fmt(i.pfd))).join('<br>'),c.ok?fmt(c.fU):'–',c.ok?fmt(c.fM):'–',c.ok?(c.meets?'None':fmt(c.rrr)):'–',c.ok?(c.meets?'None':fmt(c.rrf)):'–',c.ok?(c.meets?'Meets TEL':'Gap ×'+fmt(c.gap)):'incomplete'];}),['Ref','Consequence','S','TEL','Initiating events','Enabling and modifiers','IPLs (PFD)','f unmit.','f mit.','RRR','RRF','Result']);}
 if(ST.groups.length)h+=`<h2>${n++}. Scenario groups</h2>`+T(ST.groups.map(g=>{const c=groupCalc(g);return [g.id,esc(g.name),esc(g.desc),esc(g.tol),esc(c.mem.map(x=>x.ref).join(', ')),c.n?fmt(c.sum):'–',c.meets==null?'–':c.meets?'Meets':'Exceeds'];}),['ID','Group','Description','Tolerance /yr','Scenarios','Σ f mitigated','Result']);
 h+=`<h2>${n++}. Recommendations</h2>`+(ST.recs.length?T(ST.recs.map(r=>{const k=info[r.id];return [r.id,nl2br(r.text),esc(k.rows.join(', ')),k.risk?k.risk.band+' '+k.risk.R:'',esc(r.by),esc(r.due),esc(r.status)];}),['ID','Recommendation','Raised from','Highest risk','Action by','Due','Status']):'<p>None.</p>');
 if(ST.park.length)h+=`<h2>${n++}. Parking Lot</h2>`+T(ST.park.map(p=>[p.id,esc(refOf(p.row)),esc(p.text),esc(p.by),esc(p.res),p.status]),['ID','Row','Item','Responsible','Resolution','Status']);
 return h;}

 r.lopa.on?'Yes':'',r.lopa.on?r.lopa.ie.map(i=>i.d+' '+i.f).join('\n'):'',r.lopa.on&&c.ok?c.fU:'',r.lopa.on&&c.ok?c.fM:'',r.lopa.on&&c.hasS?c.tel:'',r.lopa.on&&c.ok?(c.meets?'None':+c.rrr.toPrecision(4)):'',r.lopa.on&&c.ok?(c.meets?'None':+c.rrf.toPrecision(4)):'',r.lopa.on&&c.ok?(c.meets?'Meets TEL':'Gap x'+fmt(c.gap)):''];}

  $('#rst').onclick=()=>ask('Restore the severity and likelihood tables and the cut-offs?','Restore',()=>{S.S=clone(U.S);S.L=clone(U.L);S.cut=[4,9,16];dirty();rSet('risk');});}
 else if(sub==='tel'){m.innerHTML=`<div class="card"><h2>Tolerable event likelihood (TEL)</h2><p class="small mut">The frequency per year at which an event of each severity is tolerated. LOPA compares the mitigated frequency of a scenario with the TEL of its severity. The values below are teaching defaults, one decade per severity step: replace them with the criteria of your company or of your group's design basis.</p>
  <div class="tscroll"><table class="t"><tr><th style="width:60px">S</th><th>Name</th><th>People</th><th style="width:160px">TEL (per year)</th></tr>${S.S.map(s=>`<tr><td><b>${s[0]}</b></td><td>${esc(s[1])}</td><td>${esc(s[2])}</td><td><input data-s="${s[0]}" value="${esc(S.tel[s[0]])}"></td></tr>`).join('')}</table></div><p class="small mut">Write a number such as 1e-5 or 0.00001.</p></div>`;

 else if(sub==='lib'){m.innerHTML=`<div class="card"><h2>LOPA libraries</h2><p class="small mut">Typical order-of-magnitude values used as starting points in the LOPA scenario window. They are teaching defaults in the style of the CCPS LOPA book: replace them with data from your own plant and your own company standard before you rely on them.</p>

  <h3>Independent protection layers (PFD)</h3><div class="tscroll" id="l2"></div><div class="toolbar"><button class="btn sec" id="a2">+ IPL</button></div>

  const draw=()=>{lt('#l1',S.ie,['Initiating event','Frequency per year']);lt('#l2',S.ipl,['Protection layer','PFD','Type']);lt('#l3',S.cm,['Modifier','Probability']);};draw();

 else{m.innerHTML=`<div class="card"><h2>Study file</h2><p class="small mut">The study is saved in this browser automatically. Use <b>Save file</b> to keep a copy or hand it in, and <b>Open file</b> to continue on another computer. A file saved by the earlier HAZOP Workshop of ${U.id} can be opened too: its rows, causes, safeguards and recommendations are converted.</p>

function loadExample(){snap('example');const node=U.example.node;rowsOf(node).forEach(r=>r.recs.forEach(()=>{}));ST.rows[node]=[];const map={};
 U.example.recs.forEach(r=>{const id=nextRecId();map[r[0]]=id;ST.recs.push({id,text:r[1],by:r[2],due:'',status:'Open',resp:''});});
 ST.rows[node]=U.example.rows.map(x=>{const r=newRow({param:x[0],gw:x[1],dev:x[2],causes:x[3].split('; ').join('\n'),cons:x[4],S:String(x[6]),L:String(x[7]),recs:x[8].map(k=>map[k]),notes:'Worked example'});
  x[5].split('; ').map(s=>s.trim()).filter(Boolean).forEach(t=>{const s=sgFind(t)||sgAdd(t);r.sg.push(s.id);});return r;});
 dirty();UI.node=node;UI.fParam='';UI.fGw='';show('ws');toast('Worked example loaded in '+node,true);}
function saveFile(){download(fname('json'),new Blob([JSON.stringify(ST,null,1)],{type:'application/json'})).then(ok=>ok&&toast('Study file saved'));}
function migrateOld(o){const S=blank();S.meta=Object.assign(S.meta,o.meta||{});if(o.team)S.team=o.team.map(t=>Object.assign({org:'',email:''},t));
 Object.keys(o.rows||{}).forEach(n=>{S.rows[n]=(o.rows[n]||[]).map(x=>{const r=Object.assign({id:'r'+(++S.seq),param:'',gw:'',dev:'',causes:'',cons:'',cat:'PER',sg:[],S:'',L:'',recs:[],park:[],notes:'',lopa:{on:false,ie:[],en:[],cm:[],ipl:[]}},{param:x.param,gw:x.gw,dev:x.dev,causes:x.causes,cons:x.cons,S:x.S,L:x.L,recs:x.recs||[],notes:x.notes});
  String(x.safe||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(t=>{let s=S.sg.find(z=>z.text===t);if(!s){s={id:'S'+String(++S.sgseq).padStart(3,'0'),text:t,tag:(t.match(/\b[A-Z]{1,4}-?\d{3}[A-Z]?\b/)||[''])[0],type:guessType(t),pfd:''};S.sg.push(s);}r.sg.push(s.id);});return r;});});
 S.recs=(o.recs||[]).map(r=>Object.assign({by:'',due:'',status:'Open',resp:''},r));return fixState(S);}
function openFile(f){const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||o.unit!==UID)throw new Error('This file is not a study of '+UID);
  ST=o.v===2?fixState(o):migrateOld(o);persist();show('main');toast(o.v===2?'Study opened':'Study from the earlier HAZOP Workshop converted and opened');}catch(e){toast('Cannot open: '+e.message);}};rd.readAsText(f);}

function mqConnect(onMsg,onStatus,subs){let i=0,c=null;const dial=()=>{if(typeof mqtt==='undefined'){onStatus('no-lib');return;}
  if(i>=BROKERS.length){onStatus('fail');i=0;setTimeout(dial,8000);return;}onStatus('connecting');
  try{c=mqtt.connect(BROKERS[i],{clientId:'hz'+Math.random().toString(36).slice(2,9),connectTimeout:6000,reconnectPeriod:0,clean:true});}catch(e){i++;dial();return;}
  const to=setTimeout(()=>{try{c.end(true);}catch(e){}i++;dial();},7000);
  c.on('connect',()=>{clearTimeout(to);onStatus('ok');subs.forEach(s=>c.subscribe(s));});
  c.on('message',(t,m)=>{try{onMsg(t,JSON.parse(m.toString()));}catch(e){}});
  c.on('close',()=>{onStatus('lost');setTimeout(()=>{if(!c.connected){dial();}},4000);});
  c.on('error',()=>{});};
 dial();return {pub:(t,o,retain)=>{if(c&&c.connected)c.publish(t,JSON.stringify(o),{qos:0,retain:!!retain});},end:()=>{try{c&&c.end(true);}catch(e){}}};}

function tri(s){s=' '+String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()+' ';const o=new Set();for(let i=0;i<s.length-2;i++)o.add(s.slice(i,i+3));return o;}
function jac(a,b){if(!a.size||!b.size)return 0;let n=0;a.forEach(x=>{if(b.has(x))n++;});return n/(a.size+b.size-n);}
const TAGRE=/\b[A-Z]{1,5}-?\d{3}[A-Z]?\b/g;
function tagsIn(s){return new Set((String(s).match(TAGRE)||[]).map(t=>t.replace(/^([A-Z]+)(\d)/,'$1-$2')));}
const STOP=new Set('the a an of to in on at for and or is are be by with from as its it into than then that this low high more less no not only per'.split(' '));
function words(s){return new Set(String(s).toLowerCase().split(/[^a-z0-9₂]+/).filter(w=>w.length>3&&!STOP.has(w)));}
function itemFound(item,lines){const it=tagsIn(item),iw=words(item),itr=tri(item);let best=0,why='';
 for(const l of lines){const lt=tagsIn(l);let shared=0;it.forEach(t=>{if(lt.has(t))shared++;});
  if(shared)return {ok:true,why:'same tag',line:l};
  const lw=words(l);let w=0;iw.forEach(x=>{if(lw.has(x))w++;});if(w>=2)return {ok:true,why:'shared words',line:l};
  const j=jac(itr,tri(l));if(j>best){best=j;why=l;}}

function normGroup(G){if(G.__norm)return G.__norm;const rows={};

 U.nodes.forEach(n=>{if(opt.skipEx&&n.id===U.example.node)return;const kn=K.nodes.find(x=>x.id===n.id);if(!kn)return;const gr=(G.rows&&G.rows[n.id])||[];
  const nd={id:n.id,rows:[],sc:{cov:[0,0],cause:[0,0],safe:[0,0],risk:[0,0],rec:[0,0]}};
  const usedG=new Set();
  kn.rows.forEach((k,i)=>{const ref=n.id+'.'+(i+1);const cand=gr.map((r,j)=>({r,j})).filter(x=>x.r.param===k[0]&&x.r.gw===k[1]);
   let m=null;if(cand.length){m=cand.map(x=>({x,s:jac(tri(k[2]+' '+k[3]),tri(x.r.dev+' '+x.r.causes))})).sort((a,b)=>b.s-a.s)[0].x;}
   const row={ref,k,g:m?m.r:null,gi:m?m.j:-1,causes:[],safes:[],risk:null,rec:null};
   nd.sc.cov[1]++;if(m){nd.sc.cov[0]++;usedG.add(m.j);}
   const gc=m?String(m.r.causes).split(/\n|;/).map(s=>s.trim()).filter(Boolean):[];

   k[3].split('; ').forEach((c,ci)=>{const key=ref+'|c|'+ci;let f=m?itemFound(c,gc):{ok:false};if(key in ov)f={ok:ov[key],why:'instructor',line:''};row.causes.push({t:c,f,key});nd.sc.cause[1]++;if(f.ok)nd.sc.cause[0]++;});

   if(m&&m.r.S&&m.r.L){const dS=Math.abs(+m.r.S-k[6]),dL=Math.abs(+m.r.L-k[7]);const kb=riskOf(k[6],k[7]),gb=riskOf(m.r.S,m.r.L);

  gr.forEach((r,j)=>{if(!usedG.has(j)&&(r.dev||r.causes))out.extra.push({node:n.id,ref:n.id+'.'+(j+1),r});});

 CMP.res.forEach((r,i)=>{const G=CMP.groups[i];s1.push([W(G.__name),W(G.meta&&G.meta.group),...['cov','cause','safe','risk','rec'].map(k=>({v:Math.round(1000*r.tot[k][2])/10,s:2})),{v:Math.round(10*r.score)/10,s:2},W(r.extra.length)]);});
 s1.push([]);s1.push([{v:'Weights: coverage 30, causes 25, safeguards 20, risk 15, recommendations 10. Percentages are of the reference study ('+U.key.nodes.reduce((s,n)=>s+n.rows.length,0)+' rows)'+(CMP.opt.skipEx?', node '+U.example.node+' excluded (worked example).':'.'),s:0}]);
 const s2=[[H('Group'),H('Ref'),H('Parameter'),H('Guide word'),H('Found'),H('Causes found'),H('Safeguards found'),H('Risk pts'),H('Rec.')]];
 CMP.res.forEach((r,i)=>r.nodes.forEach(nd=>nd.rows.forEach(x=>s2.push([W(CMP.groups[i].__name),W(x.ref),W(x.k[0]),W(x.k[1]),W(x.g?'yes':'no'),W(x.causes.filter(c=>c.f.ok).length+' / '+x.causes.length),W(x.safes.filter(c=>c.f.ok).length+' / '+x.safes.length),W(x.risk?x.risk.pts:''),W(x.rec?(x.rec.ok?'yes':'no'):'')]))));
 download('PHA_'+U.id+'_scores.xlsx',xlsx([{name:'Scores',rows:s1,widths:[28,18,11,11,11,11,14,11,10]},{name:'By reference row',rows:s2,widths:[24,8,12,12,8,12,14,9,7]}])).then(ok=>{if(ok)toast('Scores saved');});}
/* ================= START ================= */
if(qs.get('hz')){phoneInit();}else{init();facInit();}
</script>

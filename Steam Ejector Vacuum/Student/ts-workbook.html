<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam Ejector Vacuum Ver 1 Troubleshooting Workbook · Woods six stages</title>

<style>
:root{--navy:#0E2A47;--ink:#1F2933;--muted:#5F6B7A;--line:#DCE2EA;--card:#F5F7FA;--bg:#FFFFFF;--red:#C8102E;--blue:#1F5FA8;--green:#1E8449;--orange:#D9822B;--amber:#F2C14E;--sel:#EEF3FA;
  --font:'Montserrat','Prompt','Leelawadee UI','Tahoma',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
#app{display:grid;grid-template-columns:262px 1fr;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--navy);color:#fff}
header .brand{font-weight:800;letter-spacing:.02em;font-size:16px;white-space:nowrap}
header .brand small{display:block;font-weight:500;font-size:11px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
header .ptitle{flex:1;min-width:0;font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}

#saveState{font-size:12px;opacity:.8;white-space:nowrap}
#timer{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border-radius:8px;padding:3px 6px}
#timer .face{font-weight:800;font-size:17px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
#timer.warn .face{color:var(--amber)}#timer.done .face{color:#FF7A7A}
#timer button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:5px;font-size:11px;padding:2px 5px;cursor:pointer}
nav{background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 30px}
nav .grp{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px}
nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-weight:600;font-size:14px}
nav a:hover{background:#E9EEF4}nav a.on{background:var(--navy);color:#fff}
nav a .no{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--navy);color:var(--navy);font-weight:800;font-size:12px;flex:0 0 26px}
nav a.on .no{background:var(--red);border-color:var(--red);color:#fff}
nav a .pg{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}nav a.on .pg{color:#cfd8e3}
nav a .bar{display:block;height:3px;background:#E1E6EC;border-radius:2px;margin-top:3px;overflow:hidden}nav a .bar i{display:block;height:100%;background:var(--green)}
nav a.on .bar{background:rgba(255,255,255,.25)}
nav .nl{flex:1;min-width:0}
main{overflow-y:auto;padding:22px 30px 80px}
#otsPane{grid-column:2;grid-row:2;display:none;flex-direction:column;min-height:0}#otsPane .otsbar{display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}#otsFrame{flex:1;width:100%;border:0;background:#fff}
.wrap{max-width:1240px;margin:0 auto}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0 0 4px}
h1{font-size:28px;margin:0 0 6px;color:var(--navy)}h2{font-size:21px;color:var(--navy);margin:0}h3{font-size:16.5px;color:var(--navy);margin:14px 0 6px}
.gq{font-size:20px;font-weight:700;color:var(--red);margin:4px 0 14px;line-height:1.3}
.thg{display:block;font-family:'Prompt',var(--font);font-weight:400;font-size:13.5px;color:var(--muted);margin-top:2px}
.stagecard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stagecard>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stagecard h4{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stagecard ul{margin:0;padding-left:18px}.stagecard li{margin:2px 0;font-size:14px}
.stagecard .out{border-top:4px solid var(--green)}.stagecard .what{border-top:4px solid var(--blue)}.stagecard .obj{border-top:4px solid var(--red)}
.substrip{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.substrip a{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--navy);text-decoration:none;cursor:pointer}
.substrip a.key{border-color:#E7A1AC}.substrip a.done{background:#EAF6EE;border-color:var(--green);color:var(--green)}
.sub{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:12px 16px 14px;margin:0 0 14px;background:#fff}
.sub.key{border-left-color:var(--red)}
.sub .sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sub .sn{font-weight:800;color:var(--blue);font-size:14px}.sub.key .sn{color:var(--red)}
.sub .st{font-weight:700;color:var(--navy);font-size:17px}
.sub .tick{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}.sub .tick.ok{color:var(--green)}
.sub .hint{font-size:13.5px;color:var(--muted);margin:2px 0 8px}
.fld{margin:8px 0}.fld>label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
textarea{min-height:64px;resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}.chk input{width:18px;height:18px}
table.ed{width:100%;border-collapse:collapse;margin:4px 0}
table.ed th{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 5px;border-bottom:2px solid var(--navy);white-space:nowrap}
table.ed td{padding:3px 3px;border-bottom:1px solid var(--line);vertical-align:top}
table.ed td input,table.ed td select,table.ed td textarea{padding:4px 6px;font-size:13.5px;border-width:1px}
table.ed td textarea{min-height:34px}
table.ed td.x{width:28px;text-align:center}
table.ed td.cv{font-weight:700;color:var(--navy);padding-top:8px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:7px;padding:5px 11px;font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--sel)}.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover{background:#1b3d63}
.btn.red{border-color:var(--red);color:var(--red)}.btn.sm{padding:2px 8px;font-size:12px}.btn.ghost{border-color:var(--line);color:var(--muted)}
.del{border:none;background:none;color:#B0B8C4;cursor:pointer;font-size:16px;line-height:1}.del:hover{color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.note{font-size:13px;color:var(--muted)}.warn{background:#FFF6E5;border:1px solid #F2C98B;border-radius:8px;padding:7px 11px;font-size:13.5px;margin:6px 0}
.okbox{background:#EAF6EE;border:1px solid #A9D8B8;border-radius:8px;padding:7px 11px;font-size:13.5px;margin:6px 0}
.casebox{background:#FFF8EE;border:1.5px solid #F2C98B;border-radius:10px;padding:10px 14px;margin:6px 0}
.casebox b.code{color:var(--red)}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--navy)}
.pill.S{background:#EAF6EE;color:var(--green);border-color:#A9D8B8}.pill.D{background:#FDF1F1;color:var(--red);border-color:#EDB0B9}.pill.N{color:var(--muted)}
.tier1{color:#fff;background:var(--red);border-color:var(--red)}.tier2{color:#fff;background:var(--orange);border-color:var(--orange)}.tier3{color:#fff;background:#8A96A6;border-color:#8A96A6}
.st-Killed{color:var(--red);font-weight:700}.st-Confirmed{color:var(--green);font-weight:700}.st-Survives{color:var(--blue);font-weight:700}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:#fff}
.card.test{border-left:5px solid var(--orange)}
.card .ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
.card .ch b.tid{font-size:15px;color:var(--orange)}
.card .ch .ttl{font-weight:700;color:var(--navy);flex:1;min-width:200px}
.chart{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:190px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:8px;background:#fff}
.chips span{font-size:12px;padding:2px 8px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:var(--card)}
.chips span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.drop{border:2px dashed #B6C2D2;border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:var(--card)}
.drop.over{border-color:var(--blue);background:var(--sel)}
.ds{display:grid;grid-template-columns:70px 1fr 120px 150px 120px 30px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kind{font-size:11px;font-weight:800;text-transform:uppercase;padding:2px 6px;border-radius:5px;color:#fff;text-align:center}
.kind.run{background:var(--blue)}.kind.snapshot{background:var(--green)}.kind.log{background:var(--orange)}
.cand{display:grid;grid-template-columns:24px 1fr 110px;gap:8px;align-items:start;padding:5px 0;border-bottom:1px dashed var(--line)}
.cand textarea{min-height:36px;font-size:13.5px}
.figgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.fig{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.fig .cap{display:flex;gap:6px;margin-top:5px}
.sdn td.c select{width:52px;padding:3px;text-align:center;font-weight:800}
.sdn td.c select.S{background:#EAF6EE;color:var(--green)}.sdn td.c select.D{background:#FDF1F1;color:var(--red)}
.sdn th.ev{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;max-height:150px;font-size:11px}
.fish{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:auto}
.sk-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.sk-tools .sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sk-tools .sw.on{box-shadow:0 0 0 2.5px var(--navy)}
#skc{width:100%;border:1px solid var(--line);border-radius:8px;cursor:crosshair;touch-action:none;background:#fff}
.chk-list .ck{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ck .b{width:22px;height:22px;border-radius:5px;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:0 0 22px}
.ck.ok .b{background:var(--green);border-color:var(--green)}.ck.ok .b::after{content:'\2713'}
.deliv{border:2px solid var(--green);border-radius:12px;padding:12px 16px;margin-top:20px;background:#F6FBF7}
.deliv h3{margin-top:0;color:var(--green)}
a.btn{text-decoration:none}
.unitcard select#unitSel{font-size:15px;font-weight:700;padding:8px 10px;margin-bottom:10px}
.usum{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start;margin:0 0 10px}
.usum img{width:150px;height:96px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.usum .nopfd{width:150px;height:96px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.usum b{font-size:15.5px;color:var(--navy)}.usum p{margin:2px 0 6px;font-size:13.5px;color:var(--muted)}
.uchips{display:flex;flex-wrap:wrap;gap:5px}.uchips span{font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--sel);color:var(--blue)}.uchips .warnc{background:#FFF6E5;color:var(--orange)}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}details.more>summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}details.more[open]>summary{margin-bottom:8px}
.exbar{border:1.5px solid #BFD3EA;background:var(--sel);border-radius:12px;padding:12px 14px;margin:0 0 16px}
.exbar .exh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}.exbar .exh b{font-size:15px;color:var(--navy)}.exbar .exh>span{font-size:13px;color:var(--muted)}
.exbar .exrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.exbar .exrow select{flex:1;min-width:260px;font-weight:700}
.exbar .exa{margin:8px 0 0;font-size:13px;color:var(--muted)}.exbar .exu{font-size:11.5px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.exstrip{border:1.5px solid #BFD3EA;background:var(--sel);border-radius:12px;padding:12px 14px;margin:0 0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.exstrip .exh{grid-column:1/-1;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.exstrip .exh b{font-size:15px;color:var(--navy)}.exstrip .exh>span{font-size:13px;color:var(--muted)}
.exi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.exi .exu{font-size:11.5px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}.exi b{font-size:14px;color:var(--navy)}.exi .exa{font-size:12.5px;color:var(--muted)}.exi .row{margin-top:4px}
.hero{background:linear-gradient(135deg,var(--navy),#1F4E79);color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:16px}
.hero h1{color:#fff}.hero p{margin:6px 0 0;opacity:.9}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 40px;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.out-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.out-card h3{margin-top:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:9px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}

.vtag{font-weight:800;color:var(--navy)}
.mono{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:10px 0}
.tabs a{padding:7px 14px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}

": "Bottoms (acrylic acid) to storage · design 7 t/h", "r": [0, 14], "dv": 7.0001}, "AIT-107": {"u": "wt%", "desc": "Acrylic acid in the distillate (analyser, 4 min lag) · design 0.5001 wt% · alarm HI 1", "r": [0, 5], "dv": 0.50013}, "AIT-108": {"u": "wt%", "desc": "Acetic acid in the bottoms (analyser, 4 min lag) · design 0.3 wt% · alarm HI 0.8", "r": [0, 3], "dv": 0.30002}, "TI-106": {"u": "°C", "desc": "E-102 cooling water return · design 39.98 °C · alarm HI 43", "r": [20, 60], "dv": 39.978}, "TI-110": {"u": "°C", "desc": "Cooling water supply header · design 30 °C · alarm HI 33", "r": [20, 50], "dv": 30}, "FI-106": {"u": "t/h", "desc": "Cooling water to E-102 · design 85 t/h · alarm LO 60", "r": [0, 120], "dv": 85}, "TI-201": {"u": "°C", "desc": "Vent gas leaving E-103 (J-201 suction temperature) · design 12 °C · alarm HI 18", "r": [0, 50], "dv": 12}, "PI-201": {"u": "kPa a", "desc": "J-201 suction pressure (downstream of XV-201; with XV-201 shut it shows the ejector shut-off pressure) · design 6.849 kPa a · alarm HI 9", "r": [0, 40], "dv": 6.8485}, "FI-201": {"u": "kg/h", "desc": "N2 control bleed through PV-201 · design 5.359 kg/h · alarm LO 0.5 / HI 13", "r": [0, 20], "dv": 5.3594}, "PI-202": {"u": "kPa a", "desc": "Intercondenser E-201 pressure = J-201 discharge = J-202 suction (design 27.75 kPa a) · design 25.71 kPa a · alarm HI 29", "r": [0, 80], "dv": 25.707}, "TI-202": {"u": "°C", "desc": "J-201 discharge temperature (steam + gas mixture, lecture ≈ 147 °C) · design 149.4 °C", "r": [0, 200], "dv": 149.44}, "TI-203": {"u": "°C", "desc": "Gas leaving E-201 (design 50 °C) · design 49.43 °C · alarm HI 56", "r": [20, 120], "dv": 49.431}, "TI-204": {"u": "°C", "desc": "E-201 cooling water return · design 38.94 °C", "r": [20, 80], "dv": 38.939}, "PI-203": {"u": "kPa a", "desc": "Aftercondenser E-202 pressure = J-202 discharge (design 110 kPa a) · design 110 kPa a · alarm HI 114", "r": [90, 140], "dv": 110}, "TI-205": {"u": "°C", "desc": "Gas leaving E-202 to the vent · design 46.32 °C · alarm HI 60", "r": [20, 120], "dv": 46.322}, "TI-206": {"u": "°C", "desc": "E-202 cooling water return · design 41.67 °C", "r": [20, 80], "dv": 41.666}, "PI-209": {"u": "bar a", "desc": "MP steam header pressure · design 12 bar a · alarm LO 10.4", "r": [0, 15], "dv": 12}, "FI-210": {"u": "kg/h", "desc": "Motive steam to J-201 + J-202 (design 146.6 kg/h) · design 146.6 kg/h", "r": [0, 250], "dv": 146.6}, "TI-210": {"u": "°C", "desc": "Motive steam temperature (cannot show wet steam: saturated steam and wet steam have the same temperature) · design 183.1 °C", "r": [100, 200], "dv": 183.11}, "PI-211": {"u": "bar a", "desc": "J-201 steam-chest pressure · design 10 bar a", "r": [0, 15], "dv": 10}, "PI-212": {"u": "bar a", "desc": "J-202 steam-chest pressure · design 10 bar a", "r": [0, 15], "dv": 10}, "PI-213": {"u": "bar a", "desc": "J-203 hogger steam-chest pressure · design 0 bar a", "r": [0, 15], "dv": 0}, "FI-213": {"u": "kg/h", "desc": "Hogger J-203 motive steam · design 0 kg/h", "r": [0, 400], "dv": 0}, "LSLL-201": {"u": "%", "desc": "SIS I-2: hotwell low-low 10 % stops P-201 (keeps the barometric seal; independent switch) · design 50 %", "r": [0, 100], "dv": 50}, "PIC-101": {"u": "kPa a", "desc": "Column top pressure → PV-201 N2 bleed to the ejector suction (fail closed) · design 7 kPa a · SP 7 kPa a at design · OUT 35.73 % · alarm LO 6.5 / HI 7.6", "r": [0, 20], "dv": 7}, "PIC-210": {"u": "bar a", "desc": "Motive-steam chest pressure → PV-210 (fail open) · design 10 bar a · SP 10 bar a at design · OUT 50.23 % · alarm LO 9.7 / HI 11", "r": [0, 15], "dv": 10}, "FIC-101": {"u": "t/h", "desc": "Column feed (FV-101, fail closed) · design 10 t/h · SP 10 t/h at design · OUT 50 %", "r": [0, 20], "dv": 10}, "FIC-102": {"u": "t/h", "desc": "LP steam to reboiler E-101 (FV-102, fail closed) · design 1.655 t/h · SP 1.655 t/h at design · OUT 51.72 %", "r": [0, 3.5], "dv": 1.655}, "FIC-104": {"u": "t/h", "desc": "Reflux to T-101 (FV-104, fail closed) · design 6 t/h · SP 6 t/h at design · OUT 50 %", "r": [0, 12], "dv": 6}, "LIC-101": {"u": "%", "desc": "Reflux drum V-101 level → FV-103 distillate (fail closed) · design 50 % · SP 50 % at design · OUT 49.94 % · alarm LO 20 / HI 80", "r": [0, 100], "dv": 50}, "LIC-102": {"u": "%", "desc": "Column sump level → FV-105 bottoms (fail closed) · design 50 % · SP 50 % at design · OUT 50 % · alarm LO 20 / HI 80", "r": [0, 100], "dv": 50}, "LIC-201": {"u": "%", "desc": "Hotwell V-201 level → LV-201 condensate (fail closed) · design 50 % · SP 50 % at design · OUT 37.27 % · alarm LO 20 / HI 80", "r": [0, 100], "dv": 50}, "HIC-102": {"u": "%", "desc": "Cooling water to overhead condenser E-102 (HV-102) · design opening 80 %", "r": [0, 100], "dv": 80}, "HIC-103": {"u": "%", "desc": "Chilled water to vent condenser E-103 (HV-103) · design opening 70 %", "r": [0, 100], "dv": 70}, "HIC-201": {"u": "%", "desc": "Cooling water to intercondenser E-201 (HV-201) · design opening 70 %", "r": [0, 100], "dv": 70}, "HIC-205": {"u": "%", "desc": "Cooling water to aftercondenser E-202 (HV-205) · design opening 70 %", "r": [0, 100], "dv": 70}, "HIC-202": {"u": "%", "desc": "N2 vacuum breaker HV-202 (shutdown only) · design opening 0 %", "r": [0, 100], "dv": 0}}, "te": [{"code": "TE-1", "title": "Vacuum drifting up in the afternoon", "sit": "Unit lined out. Over the afternoon the column pressure has been creeping up and the N2 bleed is nearly shut. The day is hot."}, {"code": "TE-2", "title": "Pressure swinging, J-201 noisy", "sit": "Unit lined out. The panel man reports PIC-101 and PI-201 swinging; the field says J-201 is crackling. TI-210 reads normal."}, {"code": "TE-3", "title": "Bleed valve closing, pressure creeping", "sit": "Unit lined out. Over the last few minutes PV-201 has closed by itself; it is now at 0 % and PIC-101 is rising (about 7.8 kPa a)."}, {"code": "TE-4", "title": "Bottoms hot, PIC-101 on set point", "sit": "Unit lined out. PIC-101 sits exactly on 7.0 kPa a, yet the N2 bleed FI-201 has more than doubled (about 13 kg/h), TI-102 reads about 52 °C instead of 48 °C and PI-202 alarms high."}, {"code": "TE-5", "title": "Hotwell pump keeps stopping", "sit": "Unit lined out. LIC-201 alarmed high (about 87 %) although nothing changed on the ejector package; LV-201 is wide open and the field says the hotwell sight glass looks lower than usual."}, {"code": "TE-6", "title": "Steam consumption up, vacuum fine", "sit": "Utilities complain that the vacuum package now uses more steam; the column is on spec."}, {"code": "TE-7", "title": "Sudden loss of vacuum at night", "sit": "Night shift: the column pressure jumped to about 9 kPa a, the J-201 and J-202 BREAK alarms came in and PIC-210 cannot hold 10 bar a."}, {"code": "TE-8", "title": "Vent gas warm, PV-201 at zero", "sit": "Unit lined out. TI-201 has risen from 12 to 35 °C, the bleed is shut and PIC-101 reads about 8.2 kPa a."}, {"code": "TE-9", "title": "Air coming from the idle hogger", "sit": "Unit lined out, hogger J-203 idle. The pressure has risen and the bleed closed; a field operator hears air being drawn in near the hogger silencer."}, {"code": "TE-10", "title": "J-202 discharge creeping up", "sit": "Unit lined out. PI-203 has crept from 110 to about 120 kPa a over 15 minutes."}, {"code": "TE-11", "title": "Boil-up down, steam valve wide open", "sit": "Unit lined out. Production dropped this shift; FIC-102 is below set point with its valve at 100 %."}], "cats": ["Motive steam & utilities", "Ejectors & condensers", "Vacuum column & reboiler", "Hotwell & barometric seal", "Instruments & control", "People & procedures"], "pfdNote": "PFD VD-PFD-001 · the P&ID sheets VD-PID-101 / VD-PID-201 rev B are in the P&ID tab of this OTS.", "loaded": "2026-11-09", "url": "", "topic": "SEP", "status": "Full", "desc": "Vacuum column T-101 (acetic / acrylic acid) at 7.0 kPa a held by a two-stage steam-ejector package J-201 / E-201 / J-202 / E-202 with hotwell V-201", "otsName": "Steam Ejector Vacuum Ver 1", "topicName": "Separation · vacuum systems", "catalog": true, "pidCrop": {"i": 1, "x": 0.018, "y": 0.034, "w": 0.74, "h": 0.77}, "pidNote": "P&ID VD-PID-101 (column and overhead) · VD-PID-201 (steam-ejector vacuum system), rev B"}, "created": "2026-11-09T09:00:00.000Z", "updated": "2026-11-09T09:00:00.000Z", "meta": {"title": "TE-1 worked example · Woods six stages", "course": "2105412 Process Engineering Problem Solving", "unit": "cu_steam_ejector_vacuum_ver_1", "caseCode": "TE-1", "caseTitle": "Vacuum drifting up in the afternoon", "sit": "Unit lined out. Over the afternoon the column pressure has been creeping up and the N2 bleed is nearly shut. The day is hot.", "team": "Worked example (from a real OTS run)", "date": "2026-11-09", "instructor": "", "members": [{"name": "Team member A", "id": "", "role": "Leader"}, {"name": "Team member B", "id": "", "role": "OTS operator"}, {"name": "Team member C", "id": "", "role": "Data analyst"}, {"name": "Team member D", "id": "", "role": "Devil’s advocate"}], "pfd": "", "skbg": {"kind": "pid", "i": 1, "crop": {"x": 0.2, "y": 0.09, "w": 0.336, "h": 0.424}}}, "d": {"0.1": {"unit": "Vacuum distillation column T-101 separates 10 t/h of feed into crude acetic acid (top, 3.0 t/h) and acrylic acid (bottoms, 7.0 t/h) at 7.0 kPa a top, 89 °C bottom. The vacuum is made by a two-stage steam-ejector package: J-201 → surface intercondenser E-201 → J-202 → aftercondenser E-202 → vent; condensate drains by barometric legs to hotwell V-201. PIC-101 holds the column pressure by bleeding N2 into the J-201 suction (PV-201); the ejectors run at constant motive steam (PIC-210, 10 bar a)."}, "0.2": {"rows": [{"what": "Column pressure creeping up: PIC-101 7.00 → 8.82 kPa a in 30 min", "who": "Panel operator", "when": "0:00–0:30", "tag": "PIC-101"}, {"what": "N2 bleed closed: FI-201 5.36 → 0 kg/h (LO alarm)", "who": "Panel operator", "when": "00:13:54", "tag": "FI-201"}, {"what": "CW supply hot alarm: TI-110 38.0 °C", "who": "DCS alarm", "when": "00:09:31", "tag": "TI-110"}, {"what": "Intercondenser gas outlet high: TI-203 59.9 °C", "who": "DCS alarm", "when": "00:12:58", "tag": "TI-203"}, {"what": "The day is hot (situation text)", "who": "Shift supervisor", "when": "afternoon", "tag": ""}]}, "0.4": {"ctx": "Afternoon shift on a hot day; unit lined out at design before the drift; no maintenance or set-point change logged. The tag snapshot at 0:30 compares every transmitter with its design value.", "normal": [{"tag": "PIC-101 kPa a", "unit": "kPa a", "normal": "7.00", "now": "8.82"}, {"tag": "FI-201", "unit": "kg/h", "normal": "5.36", "now": "0.00"}, {"tag": "TI-110", "unit": "°C", "normal": "30.0", "now": "38.0"}, {"tag": "TI-203", "unit": "°C", "normal": "49.4", "now": "59.9"}, {"tag": "TI-204", "unit": "°C", "normal": "38.9", "now": "45.6"}, {"tag": "TI-201", "unit": "°C", "normal": "12.0", "now": "21.8"}, {"tag": "PI-202", "unit": "kPa a", "normal": "25.7", "now": "27.6"}, {"tag": "TI-104", "unit": "°C", "normal": "89.0", "now": "90.2"}]}, "0.5": {"ok": true}, "R.1": {"p": "J-201 works on its curve: with critical flow its suction pressure rises in proportion to the gas and vapour it must move. That load is the air leak plus the N2 bleed plus whatever vapour the overhead condenser E-102 and the vent condenser E-103 let through, so warmer cooling water means more vapour and a higher suction pressure. PIC-101 keeps the pressure by trimming the N2 bleed: once the bleed is at zero the pressure is no longer controlled. The intercondenser sets the J-201 discharge (PI-202); the stage holds only while PI-202 stays below its maximum discharge pressure (MDP)."}, "R.2": {"eq": "W = Wd · (Ps − Pso) / (Pd − Pso)   (J-201 on its curve; it breaks if PI-202 > MDP)", "sym": [{"s": "W", "m": "gas + vapour load drawn by J-201, air-equivalent", "u": "kg/h"}, {"s": "Wd", "m": "rated load at the design suction (18.54)", "u": "kg/h"}, {"s": "Ps", "m": "suction pressure (PI-201 ≈ PIC-101)", "u": "kPa a"}, {"s": "Pd", "m": "design suction pressure (7.0)", "u": "kPa a"}, {"s": "Pso", "m": "shut-off pressure (blank-off reading, ≈ 3.0)", "u": "kPa a"}, {"s": "MDP", "m": "maximum discharge pressure, ∝ motive pressure (≈ 29.7 at design)", "u": "kPa a"}]}, "R.3": {"calc": {"nor": "7.00", "now": "8.82", "m": "0.667", "cp": "4.19", "Ti": "38.0", "To": "45.6"}}, "R.4": {"modes": [{"mode": "Cooling water hot or short (all condensers)", "sig": "TI-110 ↑; TI-106, TI-204, TI-206 ↑; TI-201 ↑; FI-201 ↓; PIC-101 ↑"}, {"mode": "One condenser fouled", "sig": "its approach (gas out − CW out) ↑ while the others keep theirs; its CW rise ↓"}, {"mode": "More non-condensable load (air in-leakage)", "sig": "FI-201 ↓, PIC-101 ↑ with normal condenser temperatures"}, {"mode": "Weak motive steam", "sig": "FI-210, PIC-210 or PI-209 off design; PI-202 close to MDP; BREAK alarm"}, {"mode": "Discharge side restricted", "sig": "PI-203 ↑ above 110 kPa a; PI-202 follows"}, {"mode": "Transmitter error", "sig": "one tag disagrees with its neighbours (PIC-101 vs PI-201 vs TI-102)"}]}, "R.5": {"chk": "TI-110 against design (30 °C)\nApproaches of E-201, E-202 and E-102 against design\nFI-210, PIC-210, PI-209, PI-203 against design\nPIC-101 against PI-201 and TI-102\nPI-202 against the J-201 MDP\nThe snapshot: every SP and HIC output\nThe field: hissing, crackling, sight glasses"}, "1.1": {"roles": [{"name": "Team member A", "role": "Leader"}, {"name": "Team member B", "role": "OTS operator"}, {"name": "Team member C", "role": "Data analyst"}, {"name": "Team member D", "role": "Devil’s advocate"}]}, "1.2": {"rows": [{"info": "The column pressure has been creeping up over the afternoon", "from": "Panel operator", "fio": "Fact"}, {"info": "The N2 bleed is nearly shut", "from": "Panel operator", "fio": "Fact"}, {"info": "The day is hot", "from": "Shift supervisor", "fio": "Fact"}, {"info": "“It must be an air leak, it always is”", "from": "Day-shift operator", "fio": "Opinion"}, {"info": "The ejectors are probably worn", "from": "Maintenance", "fio": "Inference"}]}, "1.3": {"saf": "Possible", "safn": "TI-104 90.2 °C, alarm 95 °C, TSHH-104 trip 100 °C; rising ≈ 0.05 °C/min (0:25–0:30)", "env": "No", "envn": "Vent TI-205 55.1 °C (alarm 60); no plume reported", "eq": "Possible", "eqn": "PI-202 27.6 kPa a below the J-201 MDP (33.0 kPa a, model); PIC-101 HI alarm active", "prod": "Yes", "prodn": "Distillate FI-103 3.00 → 2.80 t/h; AIT-107 0.59 wt% (alarm 1.0)", "v": "Not time-critical — investigate while running", "ttl": "≈ 102 min to the 95 °C alarm on TI-104 at the present rate"}, "1.4": {"dec": "Keep running and investigate", "why": "No limit is close: TI-104 90.2 °C against 95, the product is on spec and the stage has not broken. The pressure is uncontrolled (bleed at zero), so it is watched and a boil-up trim is ready as the safe-park move.", "park": "If TI-104 passes 92 °C or PIC-101 passes 9.5 kPa a: FIC-102 SP down by about 12 % (less vapour to the overhead and to J-201)."}, "1.5": {"sp": "A stable, safe operating state you can hold while you investigate (here: less boil-up, column on its alarms).", "tc": "A limit (alarm, trip, damage, spec) will be reached before the investigation can finish."}, "1.6": {"p": "J-201 on its curve: suction pressure rises with the vapour + gas load, and the load rises when the condensers before it get warmer."}, "1.7": {"ppl": [{"who": "Shift supervisor", "how": "Decide", "msg": "Pressure 8.8 kPa a and rising slowly, product on spec; we investigate while running."}, {"who": "Utilities", "how": "Involve", "msg": "Ask for CW supply temperature, chiller and steam."}, {"who": "Field operator", "how": "Involve", "msg": "Walk-round of the ejector package and the overhead."}, {"who": "Production planning", "how": "Inform", "msg": "Distillate rate a little low this shift."}], "reply": "The column is safe and on spec; the vacuum is drifting because of the cooling side. We are checking the cooling water and the intercondenser and will report in 30 min."}, "2.1": {"u": function subFilled(n) {
  const d = P.d[n];
  switch (n) {
    case '0.3': return P.figs.some(f => f.stage === 's0') || P.evidence.some(e => e.initial);
    case '3.4': case '3.6': return P.hyp.length > 0;
    case '3.9': return P.timeline.length > 0;
    case '4.2': return P.evidence.some(e => e.inSdn);
    case '4.3': return P.hyp.some(h => h.sdn && Object.values(h.sdn).some(Boolean));
    case '4.4': return P.hyp.some(h => h.P && h.S && h.T);
    case '4.6': return P.tests.length > 0;
    case '4.7': return P.tests.length > 0 && P.tests.every(t => isFilled(t.kill));
    case '4.8': case '6.4': return P.tests.some(t => num(t.cost) > 0) || P.ledger.length > 0;
    case '5.0': return P.tests.some(t => t.res && (t.res.ds || isFilled(t.res.obs)));
    case '5.3': return Object.keys(P.dscore).length > 0;
    case '2.2': return !!P.sketch;
    case '0.1': return isFilled(d && d.unit);
  }

}

const fld = (label, html) => `<div class="fld"><label>${label}</label>${html}</div>`;
const fldA = (label, html) => `<div class="fld adv"><label>${label}</label>${html}</div>`;
const allCols = () => { const s = new Set(); runSets().forEach(d => d.cols.forEach(c => s.add(c))); Object.keys(pack().tags || {}).forEach(t => s.add(t)); return [...s]; };
const colIn = (ds, want) => { if (!ds || !want) return ''; if (ds.cols.includes(want)) return want; const t = tagOf(want) || want.trim(); return ds.cols.find(c => tagOf(c) === t && !/ SP | OUT /.test(' ' + c + ' ')) || ds.cols.find(c => c.startsWith(want)) || ''; };
const pfdSrc = () => P.meta.pfd || pack().pfd || ((PACKS[pack().id] || {}).pfd) || '';

/* ---- Stage 0 ---- */
W.pfd = () => pfdSrc() ? `<img class="pfdimg" data-act="zoom" src="${pfdSrc()}" alt="Process flow diagram"><p class="note">Click to enlarge. ${esc(pack().pfdNote || '')}</p>` : `<p class="warn">No drawing for this unit. Upload one on the Case &amp; team page.</p>`;
W.case = () => P.meta.sit ? `<div class="casebox"><b class="code">${esc(P.meta.caseCode)}</b> · <b>${esc(P.meta.caseTitle)}</b><br>${esc(P.meta.sit)}</div>` : `<p class="warn">No case loaded — choose one on <a data-act="go" data-v="home" style="cursor:pointer">Case &amp; team</a>.</p>`;
W.figs = (n, f) => { const fs = P.figs.map((x, i) => [x, i]).filter(([x]) => x.stage === f.stage);
  return `<div class="fld"><label>Pinned trends</label>${fs.length ? `<div class="figgrid">${fs.map(([x, i]) => figCard(x, i)).join('')}</div>` : '<p class="note">No figure yet.</p>'}<button class="btn sm" data-act="go" data-v="data">Open the OTS data tab →</button></div>`; };
W.evlist = (n, f) => { const L = P.evidence.filter(e => f.filter === 'all' || e.initial);
  if (!L.length) return `<p class="note">No evidence yet — import the OTS CSV files and use <b>Suggest evidence</b> on the <a data-act="go" data-v="data" style="cursor:pointer;color:var(--blue)">data tab</a>.</p>`;
  return `<div class="fld"><label>${f.pick ? 'Evidence entering the S/D/N matrix' : 'Initial evidence'}</label><table class="ed">${L.map(e => { const i = P.evidence.indexOf(e);
    return `<tr>${f.pick ? `<td style="width:30px"><input type="checkbox" data-p="evidence/${i}/inSdn" ${e.inSdn ? 'checked' : ''}></td>` : ''}<td class="cv" style="width:60px">${esc(e.id)}</td><td>${esc(e.text)}</td><td class="note" style="width:80px">${esc(e.t)}</td><td style="width:80px"><span class="pill">${esc(e.fio)}</span></td></tr>`; }).join('')}</table></div>`; };
W.lint = (n, f) => `<div data-dv="lint" data-stage="${f.stage}"></div>`;
DV.lint = e => { const st = STAGES.find(s => s.id === e.dataset.stage), bad = [];
  const scan = (v, where) => { if (typeof v === 'string') { const m = v.match(CAUSE_WORDS); if (m) bad.push(`${where}: “…${esc(v.slice(Math.max(0, m.index - 30), m.index + 30))}…” — <b>${esc(m[0])}</b>`); } else if (v && typeof v === 'object') Object.values(v).forEach(x => scan(x, where)); };
  st.subs.forEach(u => scan(P.d[u.n], u.n)); P.evidence.filter(x => x.initial).forEach(x => scan(x.text, x.id));
  return bad.length ? `<div class="warn"><b>Possible cause named in Stage 0</b> — rewrite as an observation:<br>${bad.slice(0, 8).join('<br>')}</div>` : `<div class="okbox">No cause words found in Stage 0.</div>`; };

/* ---- calculators (Review, 3.2) ---- */
W.calc = n => { const c = (D(n).calc = D(n).calc || {}), p = k => `d/${n}/calc/${k}`;
  const r = (lab, k, ph = '') => `<div class="r"><span>${lab}</span>${inp(p(k), c[k], ph)}</div>`;
  return `<div class="calc" style="grid-template-columns:repeat(2,1fr)"><div><h4>Balance closure</h4><p class="note" style="margin:0 0 4px">Numbers separated by commas, same units (mass, energy or volume).</p>${r('In', 'in', '100.0')}${r('Out', 'out', '96.0, 3.1')}<div class="ans" data-dv="cBal" data-n="${n}"></div></div>
   <div><h4>Deviation from normal</h4>${r('Normal / design', 'nor', '115.7')}${r('Now', 'now', '124.6')}<div class="ans" data-dv="cDev" data-n="${n}"></div></div>
   <div><h4>Heat duty Q = ṁ · c<sub>p</sub> · ΔT</h4>${r('ṁ, kg/s', 'm', '10')}${r('c<sub>p</sub>, kJ/(kg·K)', 'cp', '4.19')}${r('T in, °C', 'Ti', '30')}${r('T out, °C', 'To', '45')}<div class="ans" data-dv="cQ" data-n="${n}"></div></div>
   <div class="${pack().id === 'kc' ? '' : 'adv'}"><h4>Compression temperature</h4><p class="note" style="margin:0 0 4px">T₂ = T₁ · r<sup>m</sup>, m = (γ−1)/(γ·η<sub>p</sub>) — gas compressors only</p>${r('T₁ suction, °C', 'T1', '35')}${r('Pressure ratio r', 'r', '2.0')}${r('γ (cp/cv)', 'g', '1.27')}${r('η polytropic', 'e', '0.75')}<div class="ans" data-dv="cT2" data-n="${n}"></div>${r('Measured T₂, °C → T₁', 'T2m', '')}<div class="ans" data-dv="cT1" data-n="${n}"></div></div></div>
   <p class="note">Write what the numbers say in the box below — that line is evidence.</p>`; };
DV.cQ = e => { const n = e.dataset.n, m = cv(n, 'm'), cp = cv(n, 'cp'), a = cv(n, 'Ti'), b = cv(n, 'To'); if ([m, cp, a, b].some(x => !isFinite(x))) return 'Q = —'; const q = m * cp * (b - a); return `Q = ${fmt(q)} kW (${fmt(q / 1000)} MW)`; };
const cv = (n, k) => num(((P.d[n] || {}).calc || {})[k]);
DV.cT2 = e => { const n = e.dataset.n, T1 = cv(n, 'T1'), r = cv(n, 'r'), g = cv(n, 'g'), et = cv(n, 'e'); if ([T1, r, g, et].some(x => !isFinite(x))) return 'T₂ = —'; const m = (g - 1) / (g * et); return `m = ${m.toFixed(4)} · T₂ = ${((T1 + 273.15) * Math.pow(r, m) - 273.15).toFixed(1)} °C`; };
DV.cT1 = e => { const n = e.dataset.n, T2 = cv(n, 'T2m'), r = cv(n, 'r'), g = cv(n, 'g'), et = cv(n, 'e'); if ([T2, r, g, et].some(x => !isFinite(x))) return 'T₁ = —'; const m = (g - 1) / (g * et); return `T₁ implied = ${((T2 + 273.15) / Math.pow(r, m) - 273.15).toFixed(1)} °C`; };
DV.cBal = e => { const c = (P.d[e.dataset.n] || {}).calc || {}, s = v => String(v || '').split(/[,;\s]+/).map(num).filter(isFinite).reduce((a, b) => a + b, 0); const i = s(c.in), o = s(c.out); if (!i) return 'Closure = —'; return `In ${fmt(i)} · Out ${fmt(o)} · Missing ${fmtS(i - o)} · Closure ${(o / i * 100).toFixed(1)} %`; };
DV.cDev = e => { const n = e.dataset.n, a = cv(n, 'nor'), b = cv(n, 'now'); if (!isFinite(a) || !isFinite(b)) return 'Δ = —'; return `Δ = ${fmtS(b - a)} (${a ? fmtS((b - a) / Math.abs(a) * 100) + ' %' : '—'})`; };

/* ---- Stage 1 ---- */
W.urgency = n => { const d = D(n), C = [['saf', 'Safety — people, fire, explosion'], ['env', 'Environment — flaring, release'], ['eq', 'Equipment damage — surge, temperature, vibration, trip'], ['prod', 'Product / production loss']];
  return `<table class="ed"><tr><th style="width:34%">Consequence</th><th style="width:16%">At risk?</th><th>Which limit, how far, how fast</th></tr>${C.map(([k, l]) => `<tr><td><b>${l}</b></td><td>${sel(`d/${n}/${k}`, d[k], ['No', 'Possible', 'Yes'])}</td><td>${inp(`d/${n}/${k}n`, d[k + 'n'], 'e.g. reads 124 °C; alarm 130 °C; trip 150 °C; rising 0.3 °C/min')}</td></tr>`).join('')}</table>
   <div class="g2">${fld('Verdict', sel(`d/${n}/v`, d.v, ['Time-critical', 'Not time-critical — investigate while running']))}${fld('Time to the nearest limit', inp(`d/${n}/ttl`, d.ttl, 'e.g. ≈ 20 min to the high alarm'))}</div>`; };

/* ---- Stage 2 ---- */
W.smart = n => { const d = D(n), F = [['s', 'Specific', 'the key variable back to its normal value'], ['m', 'Measurable', 'a number on a named tag'], ['a', 'Achievable', 'within the existing equipment'], ['r', 'Relevant', 'restores the margin to the alarm / trip'], ['t', 'Time-bound', 'within this shift'], ['sf', 'Safe', 'no trip, no surge, no flaring'], ['c', '$ — costed', 'at < USD 5,000 and no lost production']];
  return `<div class="g4 adv">${F.map(([k, l, ph]) => fld(l, inp(`d/${n}/${k}`, d[k], ph))).join('')}</div>${fld('Desired final state (one sentence)', area(`d/${n}/goal`, d.goal, 'Return … to … within … without … at a cost below …'))}`; };
W.w5h1 = n => { const d = D(n), F = [['what', 'What is wrong (the symptom)'], ['when', 'When — first seen, pattern'], ['where', 'Where on the unit'], ['who', 'Who noticed, who is affected'], ['why', 'Why it matters (consequence — not the cause)'], ['how', 'How it changed (numbers)']];
  return `<div class="g3">${F.map(([k, l]) => fld(l, area(`d/${n}/${k}`, d[k], '', 2))).join('')}</div>${fld('Trend shape', sel(`d/${n}/shape`, d.shape, ['Step', 'Drift / ramp', 'Oscillation', 'Offset (steady but wrong)', 'Excursion and return', 'Scatter / noise']))}`; };
W.isis = n => { const d = D(n); if (!Array.isArray(d.rows) || !d.rows.length) d.rows = [{ dim: 'What — object and defect' }, { dim: 'Where — location on the unit' }, { dim: 'When — first seen, pattern' }, { dim: 'Extent — how much, how many, trend' }];
  return `<table class="ed"><tr><th style="width:18%">Dimension</th><th>IS</th><th>IS NOT (but could be)</th><th class="adv">Distinction</th><th>So it is not … (family killed)</th><th></th></tr>${d.rows.map((r, i) => `<tr><td><textarea rows="1" data-grow="1" data-p="d/${n}/rows/${i}/dim">${esc(r.dim)}</textarea></td>${['is', 'isnot', 'dist', 'kill'].map(k => `<td class="${k === 'dist' ? 'adv' : ''}"><textarea rows="2" data-grow="1" data-p="d/${n}/rows/${i}/${k}">${esc(r[k])}</textarea></td>`).join('')}<td class="x"><button class="del" data-act="delrow" data-p="d/${n}/rows" data-i="${i}">×</button></td></tr>`).join('')}</table>
   <button class="btn sm" data-act="addrow" data-p="d/${n}/rows">+ row</button> <span class="note adv">Tip: snapshot lines marked “IS NOT candidate” on the data tab are ready-made entries for the IS NOT column.</span>`; };
const FIX_WORDS = /\b(should|must|replace|repair|increase|decrease|reduce|clean|adjust|retune|fix|install)\b/i;
W.statement = n => { const d = D(n), F = [['what', 'What (variable / symptom)', 'TI-xxx, the outlet temperature of …,'], ['where', 'Where', 'on unit …'], ['how', 'How much', 'reads … °C'], ['norm', 'Against normal', 'against … °C normal at the same rate'], ['when', 'Since when', 'since 00:02 OTS time, steady since 00:10']];
  return `<div class="g3">${F.map(([k, l, ph]) => fld(l, inp(`d/${n}/${k}`, d[k], ph))).join('')}</div>
   <div class="fld"><label>Composed</label><div class="casebox" data-dv="stmt" data-n="${n}"></div></div>
   ${fld('Final problem statement (edit freely; leave empty to use the composed sentence)', area(`d/${n}/final`, d.final, '', 2))}
   ${fld('Short label for slides and the fishbone head', inp(`d/${n}/short`, d.short, 'TI-xxx 8.9 °C above normal'))}<div data-dv="stmtchk" data-n="${n}"></div>`; };
const stmtOf = () => { const d = P.d['2.11'] || {}; if (isFilled(d.final)) return d.final.trim(); const s = [d.what, d.where, d.how, d.norm, d.when].filter(isFilled).join(' ').trim(); return s ? s.replace(/\s+/g, ' ') + (s.endsWith('.') ? '' : '.') : ''; };
DV.stmt = () => esc(stmtOf()) || '<span class="note">Fill the five boxes …</span>';
DV.stmtchk = () => { const s = stmtOf(); if (!s) return ''; const w = [], wc = s.split(/\s+/).length;
  if (!/\d/.test(s)) w.push('No number — add how much.'); const c = s.match(CAUSE_WORDS); if (c) w.push(`Names a cause (“${esc(c[0])}”) — Define states the symptom only.`); const f = s.match(FIX_WORDS); if (f) w.push(`Prescribes a fix (“${esc(f[0])}”).`); if (wc > 50) w.push(`Long (${wc} words) — aim for one quotable sentence.`);
  return w.length ? `<div class="warn">${w.join('<br>')}</div>` : `<div class="okbox">Has a number, names no cause, prescribes no fix (${wc} words).</div>`; };

/* ---- sketch pad ---- */
W.sketch = () => `${skBgBar()}<div class="sk-tools">${['#C8102E', '#1F5FA8', '#1E8449', '#111111', '#D9822B'].map((c, i) => `<span class="sw ${i === 0 ? 'on' : ''}" data-col="${c}" style="background:${c}"></span>`).join('')}
  <select id="skW" style="width:90px"><option value="3">thin</option><option value="6" selected>medium</option><option value="12">thick</option></select>
  <label class="chk" style="margin:0"><input type="checkbox" id="skText"> text</label><label class="chk" style="margin:0"><input type="checkbox" id="skHi"> highlighter</label>
  <button class="btn sm" id="skUndo">Undo</button><button class="btn sm red" id="skClear">Clear sketch</button><span class="note">Draw with mouse, pen or finger. Saved automatically.</span></div><canvas id="skc" width="${skSize()[0]}" height="${skSize()[1]}"></canvas>`;
function wireSketch() {
  const cv = $('#skc'); if (!cv) return; const ctx = cv.getContext('2d'); let col = '#C8102E', drawing = false, last = null; const undo = [];
  const bg = cb => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); const sb = skBg(), sh = P.sketch ? null : skSheet(sb), src = P.sketch || (sh && sh.src); if (!src) { cb && cb(); return; } const im = new Image(); im.onload = () => { if (sh) { const c = sb.crop, nw = sh.w, nh = sh.h, s = cv.width / (c.w * nw); ctx.drawImage(im, -c.x * nw * s, -c.y * nh * s, nw * s, nh * s); } else { const r = Math.min(cv.width / im.width, cv.height / im.height); ctx.drawImage(im, (cv.width - im.width * r) / 2, (cv.height - im.height * r) / 2, im.width * r, im.height * r); } cb && cb(); }; im.onerror = () => cb && cb(); im.src = src; };
  bg();
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height]; };
  const store = () => { try { P.sketch = cv.toDataURL('image/jpeg', 0.85); touch(); renderNav(); } catch (e) { toast('Sketch cannot be saved in this browser view'); } };
  $$('.sk-tools .sw').forEach(s => s.onclick = () => { col = s.dataset.col; $$('.sk-tools .sw').forEach(x => x.classList.toggle('on', x === s)); });
  cv.onpointerdown = e => { undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (undo.length > 25) undo.shift(); const p = pos(e);
    if ($('#skText').checked) { const t = prompt('Text to place:'); if (t) { ctx.fillStyle = col; ctx.font = 'bold 26px Montserrat, Arial, sans-serif'; ctx.fillText(t, p[0], p[1]); store(); } return; }
    drawing = true; last = p; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!drawing) return; const p = pos(e), hi = $('#skHi').checked; ctx.strokeStyle = col; ctx.globalAlpha = hi ? 0.3 : 1; ctx.lineWidth = (+$('#skW').value) * (hi ? 4 : 1); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ctx.globalAlpha = 1; last = p; };
  cv.onpointerup = () => { if (drawing) { drawing = false; store(); } };
  $('#skUndo').onclick = () => { const s = undo.pop(); if (s) { ctx.putImageData(s, 0, 0); store(); } };
  $('#skClear').onclick = () => { if (!confirm('Clear the sketch and start again from the drawing?')) return; P.sketch = ''; touch(); bg(); };
}
AFTER_HOOKS.push(wireSketch);

/* ---- Stage 3: hypotheses, fishbone, timeline ---- */
const CATS = () => pack().cats || ['Materials', 'Machine', 'Method', 'Measurement', 'People', 'Environment'];
const HSTAT = ['Open', 'Killed', 'Survives', 'Confirmed'];
function nextHid() { let m = 0; P.hyp.forEach(h => { const k = parseInt(String(h.id).replace(/\D/g, '')); if (k > m) m = k; }); return 'WH-' + (m + 1); }
const pst = h => { const p = +h.P, s = +h.S, t = +h.T; if (!p || !s || !t) return { score: NaN, tier: '' }; const sc = p * s * t; return { score: sc, tier: s === 5 || sc >= 48 ? 1 : sc >= 18 ? 2 : 3 }; };
W.fishbone = n => `<div class="fish" data-dv="fish"></div>
  <div class="row" style="margin-top:8px"><input type="text" id="fbCause" style="flex:1;min-width:280px" placeholder="Cause idea, e.g. TT-106 reads low"><select id="fbCat" style="width:260px">${CATS().map(c => `<option>${esc(c)}</option>`).join('')}</select><button class="btn pri" data-act="fbadd">Add to fishbone</button></div>
  <p class="note">Each idea becomes a working hypothesis in 3.6, where you write its “if … then …”, key signal and falsifier.</p>`;
DV.fish = () => fishSVG();
function fishSVG(o = {}) {
  const cats = CATS(), Wd = o.w || 1180, top = cats.slice(0, Math.ceil(cats.length / 2)), bot = cats.slice(Math.ceil(cats.length / 2));
  const by = c => P.hyp.filter(h => (h.cat || cats[cats.length - 1]) === c);
  const maxN = Math.max(3, ...cats.map(c => by(c).length)), half = 50 + maxN * 26, H = half * 2 + 40, cy = H / 2, x0 = 20, xe = Wd - 250;
  const head = (P.d['2.11'] && P.d['2.11'].short) || P.meta.caseTitle || 'Effect (problem)';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Wd} ${H}" font-family="Montserrat, Prompt, Arial, sans-serif"><rect width="${Wd}" height="${H}" fill="#fff"/>`;
  s += `<line x1="${x0}" y1="${cy}" x2="${xe}" y2="${cy}" stroke="#0E2A47" stroke-width="5"/><polygon points="${xe},${cy - 12} ${xe + 18},${cy} ${xe},${cy + 12}" fill="#0E2A47"/>`;
  s += `<rect x="${xe + 22}" y="${cy - 50}" width="${Wd - xe - 30}" height="100" rx="10" fill="#C8102E"/>`;
  wrapTxt(head, 22).slice(0, 4).forEach((l, i, a) => { s += `<text x="${xe + 22 + (Wd - xe - 30) / 2}" y="${cy - (a.length - 1) * 10 + i * 20 + 5}" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">${esc(l)}</text>`; });
  const nb = Math.max(top.length, bot.length), gap = (xe - x0) / (nb + 0.15), tick = gap * 0.86, maxc = Math.floor(tick / 6.9);
  const bone = (c, i, up) => { const bx = x0 + (i + 1) * gap, ty = up ? cy - half + 18 : cy + half - 18, sx = bx - (half - 18) * 0.42;
    s += `<line x1="${sx}" y1="${ty}" x2="${bx}" y2="${cy}" stroke="#1F5FA8" stroke-width="3"/>`;
    s += `<rect x="${sx - 100}" y="${up ? ty - 26 : ty + 4}" width="200" height="24" rx="5" fill="#1F5FA8"/><text x="${sx}" y="${up ? ty - 9 : ty + 21}" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">${esc(c.length > 30 ? c.slice(0, 29) + '…' : c)}</text>`;
    const L = by(c); L.forEach((h, k) => { const f = up ? (k + 1) / (L.length + 1) : 1 - (k + 1) / (L.length + 1), yy = ty + (cy - ty) * f, xx = sx + (bx - sx) * f, col = h.status === 'Killed' ? '#9AA3AF' : h.status === 'Confirmed' ? '#1E8449' : '#1F2933';
      const lab = (h.id ? h.id + ' ' : '') + (h.cause || ''); s += `<line x1="${xx - tick}" y1="${yy}" x2="${xx}" y2="${yy}" stroke="#9FB3C8" stroke-width="1.5"/><text x="${xx - 6}" y="${yy - 4}" font-size="12" fill="${col}" text-anchor="end" ${h.status === 'Killed' ? 'text-decoration="line-through"' : ''} font-weight="${h.status === 'Confirmed' ? 700 : 400}">${esc(lab.length > maxc ? lab.slice(0, maxc - 1) + '…' : lab)}</text>`; }); };
  top.forEach((c, i) => bone(c, i, true)); bot.forEach((c, i) => bone(c, i, false));
  return s + '</svg>';
}
function wrapTxt(t, n) { const w = String(t).split(/\s+/), L = []; let c = ''; w.forEach(x => { if ((c + ' ' + x).trim().length > n) { if (c) L.push(c); c = x; } else c = (c + ' ' + x).trim(); }); if (c) L.push(c); return L; }
W.hyp = () => {
  const rows = P.hyp.map((h, i) => { const p = `hyp/${i}`;
    return `<tr><td class="cv">${esc(h.id)}</td><td><textarea rows="2" data-grow="1" data-p="${p}/cause" placeholder="Cause">${esc(h.cause)}</textarea>${sel(`${p}/cat`, h.cat, CATS(), 'style="margin-top:3px;font-size:12px"')}</td>
     <td><textarea rows="2" data-grow="1" data-p="${p}/ifthen" placeholder="If … is true, then we should observe …">${esc(h.ifthen)}</textarea></td>
     <td class="adv"><textarea rows="2" data-grow="1" data-p="${p}/key" placeholder="Key signal (tag, direction)">${esc(h.key)}</textarea></td>
     <td><textarea rows="2" data-grow="1" data-p="${p}/fals" placeholder="Falsifier — what would kill it">${esc(h.fals)}</textarea></td>
     ${['P', 'S', 'T'].map(k => `<td class="adv" style="width:52px">${sel(`${p}/${k}`, h[k], ['1', '2', '3', '4', '5'])}</td>`).join('')}
     <td class="cv adv" data-dv="pst" data-i="${i}" style="width:74px"></td><td style="width:108px">${sel(`${p}/status`, h.status || 'Open', HSTAT, 'data-rr="1"')}</td>

async function gunzipB64(b64) { const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));

    if (pk.pfdGz && !pk.pfd) jobs.push(gunzipB64(pk.pfdGz).then(t => { pk.pfd = svgData(t); }).catch(() => { }));
    if (pk.pidGz && !pk.pid) { pk.pid = pk.pidGz.map(d => ({ name: d.name, w: d.w, h: d.h, src: '' }));
      pk.pidGz.forEach((d, i) => jobs.push(gunzipB64(d.gz).then(t => { pk.pid[i].src = svgData(t); }).catch(() => { }))); }
  });
  try { await Promise.all(jobs); } catch (e) { }

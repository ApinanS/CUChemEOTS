<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPEX Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* App shell: dark slate rail with grouped steps (like a DCS navigation tree), sticky app bar with segmented controls,
   KPI strip, then the working page. Teal-blue process accent, amber for assumptions, green/red for savings/increases. */
:root{
  --bg:#eef2f5; --panel:#ffffff; --panel-2:#f7f9fb; --ink:#14212b; --muted:#5d6d7a; --line:#dde4ea; --line-2:#e9eef2;
  --accent:#0e6e8c; --accent-2:#13a3b8; --accent-ink:#ffffff; --accent-soft:#e2f2f6;
  --rail:#102330; --rail-ink:#c9d7e0; --rail-muted:#7f97a6; --rail-hi:#183446;
  --warn:#9a6200; --warn-soft:#fff2d4; --good:#16794a; --good-soft:#e1f4ea; --bad:#b42a22; --bad-soft:#fbe7e5;
  --c1:#0e6e8c; --c2:#2f9e6a; --c3:#d39b2a; --c4:#7a5bb5; --c5:#6b7d8b; --c6:#c4473a; --c7:#c25c8f;
  --shadow:0 1px 2px rgba(16,35,48,.06),0 4px 14px rgba(16,35,48,.06);
  --r:14px;
  --font-body:"IBM Plex Sans","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1419; --panel:#121e26; --panel-2:#16242e; --ink:#e3ecf1; --muted:#93a6b3; --line:#243644; --line-2:#1d2d38;
  --accent:#3cb6cf; --accent-2:#62d0e3; --accent-ink:#06151b; --accent-soft:#143341;
  --rail:#08121a; --rail-ink:#c4d3dc; --rail-muted:#6f8796; --rail-hi:#12273a;
  --warn:#f0b54a; --warn-soft:#3a2c10; --good:#56c48b; --good-soft:#123425; --bad:#ff8a7e; --bad-soft:#3d1a17;
  --c1:#3cb6cf; --c2:#56c48b; --c3:#e8b34a; --c4:#a88ae0; --c5:#8fa3b1; --c6:#f07a6c; --c7:#e48ab6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1419; --panel:#121e26; --panel-2:#16242e; --ink:#e3ecf1; --muted:#93a6b3; --line:#243644; --line-2:#1d2d38;
  --accent:#3cb6cf; --accent-2:#62d0e3; --accent-ink:#06151b; --accent-soft:#143341;
  --rail:#08121a; --rail-ink:#c4d3dc; --rail-muted:#6f8796; --rail-hi:#12273a;
  --warn:#f0b54a; --warn-soft:#3a2c10; --good:#56c48b; --good-soft:#123425; --bad:#ff8a7e; --bad-soft:#3d1a17;
  --c1:#3cb6cf; --c2:#56c48b; --c3:#e8b34a; --c4:#a88ae0; --c5:#8fa3b1; --c6:#f07a6c; --c7:#e48ab6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--font-body)}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:24px;font-weight:650;letter-spacing:-.2px}
h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
h3 svg{color:var(--accent)}
a{color:var(--accent)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font:700 14px var(--font-mono)}
.brand b{display:block;font-size:16px;color:#fff;letter-spacing:.2px}
.brand small{display:block;font-size:11.5px;color:var(--rail-muted)}
.rail .grp{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--rail-muted);padding:14px 10px 6px}
.rail a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;color:var(--rail-ink);text-decoration:none;font-size:14px;position:relative}
.rail a:hover{background:var(--rail-hi);color:#fff}
.rail a.on{background:var(--rail-hi);color:#fff}
.rail a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-2)}
.rail a.on svg{color:var(--accent-2)}
.rail .foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:var(--rail-muted);border-top:1px solid var(--rail-hi)}
/* main + app bar */
.main{min-width:0;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.appbar input.title{font:600 17px var(--font-body);border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);min-width:220px;flex:1;padding:6px 8px}
.appbar input.title:hover{border-color:var(--line)}
.appbar input.title:focus{border-color:var(--accent);background:var(--panel)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--ink)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.content{padding:22px 28px 64px;display:flex;flex-direction:column;gap:18px;max-width:1400px;width:100%}
.pagehead{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;gap:6px;align-items:center}
.lead{color:var(--muted);max-width:78ch;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--accent-soft);color:var(--ink);border:1px solid transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi.good::after{background:var(--good)} .kpi.bad::after{background:var(--bad)}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.kpi .v{font:600 26px var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.2}
.kpi .v small{font:500 12.5px var(--font-body);color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted)}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:-8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
input,select,button,textarea{font:inherit;color:inherit}
input[type=number],input[type=text],select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%;transition:border-color .15s,background .15s}
input[type=number]:hover,input[type=text]:hover,select:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
input[type=number]:focus,input[type=text]:focus,select:focus{border-color:var(--accent);background:var(--panel);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=number]{font-family:var(--font-mono);text-align:right}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* tables: spreadsheet-like */
.tw{overflow-x:auto;border:1px solid var(--line-2);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--panel-2);font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;z-index:1}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td input[type=number]{width:112px;background:transparent;border-color:transparent}
td input[type=text]{min-width:200px;background:transparent;border-color:transparent}
td select{background:transparent;border-color:transparent;min-width:140px}
td input:hover,td select:hover{border-color:var(--line);background:var(--panel-2)}
tr.tot td{font-weight:650;border-top:2px solid var(--ink);background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
.dpos{color:var(--bad)} .dneg{color:var(--good)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 13px;cursor:pointer;font-size:13.5px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
td .btn.sm{border-color:transparent;background:transparent;color:var(--muted)}
td .btn.sm:hover{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
/* job cards */
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.job{border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;background:var(--panel-2);display:flex;flex-direction:column;gap:8px;text-align:left;transition:border-color .15s,transform .15s}
.job:hover{border-color:var(--accent);transform:translateY(-1px)}
.job.on{border:2px solid var(--accent);background:var(--accent-soft)}
.job .ji{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--panel);color:var(--accent);border:1px solid var(--line)}
.job .t{font-weight:650;font-size:15.5px}
.job ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.trace{font:12px/1.6 var(--font-mono);background:var(--panel-2);border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;overflow-x:auto}
.trace div{white-space:nowrap}
.trace b{font-weight:500;color:var(--muted);display:inline-block;min-width:150px}
.assumed{background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:0 6px;font-size:10.5px;font-weight:600;margin-left:4px;letter-spacing:.3px;text-transform:uppercase}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-2)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* overview */
.ov{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.3fr);gap:18px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:7px;font-size:13px;min-width:200px;flex:1}
.donut-legend div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.donut-legend i{width:12px;height:12px;border-radius:3px}
.donut-legend .p{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.donut-legend .m{font-family:var(--font-mono);font-size:12.5px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(110px,190px) 1fr 128px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:12px;background:var(--line-2);border-radius:6px;position:relative;overflow:hidden}
.hbar .track span{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--c2)}
.hbar .track span.ghost{background:transparent;border:1.5px dashed var(--muted);opacity:.7}
.hbar .val{text-align:right;font-family:var(--font-mono);font-size:12.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:st}
.steps a{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--panel-2)}
.steps a:hover{border-color:var(--accent)}
.steps a b{font-size:13.5px;display:flex;gap:6px;align-items:center}
.steps a span{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;box-shadow:var(--shadow);z-index:9}
.toast.show{opacity:1}
.note{font-size:12.5px;color:var(--muted)}
.menu-btn{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:260px;z-index:6;transform:translateX(-100%);transition:transform .2s;height:100%}
  .rail.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.4)}
  .menu-btn{display:inline-flex}
  .appbar{padding:8px 14px;position:static}
  .appbar .seg button{padding:5px 8px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .hbar{grid-template-columns:96px 1fr 104px;font-size:12.5px}
  .content{padding:16px 14px 64px}
  .ov{grid-template-columns:1fr}
  .kpi .v{font-size:22px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.grprow td{background:var(--accent-soft);font-size:12px;padding-top:6px;padding-bottom:6px}
.uptab td{vertical-align:top}
.uptab td:first-child{min-width:190px}.uptab td:nth-child(2){white-space:nowrap}
.rchart{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rrow{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center}
.rlab{font-size:12.5px;text-align:right;color:var(--ink)}
.rtrack{position:relative;height:16px;border-radius:8px;background:var(--line-2)}
.rone{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.rdot{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--bg,#fff);display:inline-block}
.rleg .rdot{position:relative;top:1px;margin:0 5px 0 0}
.rdot.tu{background:#d97706}.rdot.as{background:#2563eb}
.rleg{display:flex;gap:16px;font-size:12.5px}
.raxis{position:relative;height:16px;font-size:11px;color:var(--muted,#888)}
.raxis span{position:absolute;transform:translateX(-50%)}
@media (max-width:640px){.rrow{grid-template-columns:110px 1fr}.rlab{font-size:11px}}
/* cost stream */
.stream{gap:10px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.srow{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
.srow .cap{font-size:12px;color:var(--muted)}
.ribbon{display:flex;height:30px;border-radius:8px;overflow:hidden;gap:2px;background:var(--panel)}
.srow.thin .ribbon{height:14px}
.ribbon a{display:block;height:100%;background:var(--g);min-width:3px;transition:filter .15s}
.ribbon a:hover,.ribbon a:focus-visible{filter:brightness(1.12) saturate(1.1);outline:none}
.skey{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
.skey a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.skey a:hover{color:var(--ink)}
.skey i{width:9px;height:9px;border-radius:2px;background:var(--g);display:inline-block}
.skey b{font:500 12px var(--font-mono);color:var(--ink)}
.skey .sv{font:12px var(--font-mono);color:var(--muted)}
@media (max-width:820px){.srow{grid-template-columns:52px 1fr}}
.alt{color:var(--muted);font-size:.86em;margin-left:5px;font-weight:400;white-space:nowrap}
td .alt,td.num .alt{display:block;margin-left:0;font-size:11px;line-height:1.3}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;margin:0 0 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13px;border:1px solid var(--warn)}
.banner svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
.concept h4{margin:4px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.concept ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55}
.concept li{margin:3px 0}
.job.ptype .note b{color:var(--ink)}
.note.bad{color:var(--bad);font-weight:600}
.seg.skutabs{flex-wrap:wrap;max-width:100%}.seg.skutabs button{white-space:normal;text-align:left}
</style>
</head>

  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <main class="main"><div id="main"></div></main>
</div>
<div class="toast" id="toast" role="status"></div>

      tY = 'AP mass D11 = Σmol ' + fmt(Ksum) + ' × ' + fmt(prep.yield) + '% × ' + fmt(prep.stoichRatio) + ' × ' + fmt(prep.apMW) + ' g/mol = ' + fmt(D11) + ' ' + out;
    } else if (yt === 'AP Mass') {

      D11 = prep.yield * apw / 100; tY = 'AP mass D11 = ' + fmt(prep.yield) + ' × ' + fmt(apw) + '% = ' + fmt(D11) + ' ' + out;
    } else throw new Error('yieldType must be "% Yield", "AP Mass" or "Catalyst Mass"');

    } else {
      if (!(apw > 0)) throw new Error('Active-phase weight percent (2 Materials D10) is required and must be > 0');

    mats.forEach(function (m) {
      var lib = libOrNull(m.name), r = { name: m.name, group: m.group };
      if (m.qty === 'auto' || (m.group === 'support' && (m.qty === undefined || m.qty === null) && !autoUsed)) {

      else if (lib) pr = materialUnitPrice(lib, ctx.basisYear, out);

      r.M = pr.price;                                          // M21 = library 'Unit price' (AL)

    });
    var total = sumOk(rows.map(function (r) { return r.Q; }));   // Q14
    return {
      rows: rows, D11: D11, D12: D12, wastePercent: w, unitCost: total, warnings: warnings,
      trace: tY + '; raw materials Q14 = Σ Q = ' + fmt(total) + ' $/' + out + ' catalyst'
    };
  }

  // ---------- '3a Step Method' ----------
  /** steps: template name string, {template:name}, or [{step, qty (number | [S,M,L])}] (custom) */
  function stepCost(steps, ctx) {
    var sc = ctx.scaleInfo, f = esc(data().stepLibraryYear, ctx.basisYear), out = ctx.massUnit;
    var orderOut = ctx.orderOut, warnings = [], rows = [], isTpl = false, list, tplName = 'Custom Step Process';
    if (typeof steps === 'string') steps = { template: steps };
    if (steps && !Array.isArray(steps) && steps.template) {
      var t = idx().tpl[steps.template.toLowerCase()];
      if (!t) throw new Error('Unknown step template "' + steps.template + '"');
      list = t.steps; isTpl = true; tplName = t.name;
    } else list = Array.isArray(steps) ? steps : (steps && steps.steps) || [];
    var si = { S: 0, M: 1, L: 2 }[sc.scale];
    list.forEach(function (s) {
      var lib = idx().step[String(s.step).toLowerCase()];
      if (!lib) throw new Error('Unknown step "' + s.step + '"');
      var qty = Array.isArray(s.qty) ? s.qty[si] : s.qty;
      var hr = lib[sc.scale], r = { step: lib.name, qty: qty, hourlyLib: hr, note: lib.note };
      if (!hr) {           // fnStepCostHourly = 0 → "N/A at … scale" (checked before qty)
        r.na = 'N/A at ' + { S: 'small', M: 'medium', L: 'large' }[sc.scale] + ' scale';
        r.E = r.F = r.G = null;
        r.trace = lib.name + ': ' + r.na + (qty ? ' (qty ' + qty + ')' : '');

        r.E = hr * qty * f;                       // E30 = $/hr(scale) · qty · PPI(basis)/PPI(2017)
        r.F = r.E * sc.campaignDays * 24;         // F30 = E · campaign days · 24
        r.G = r.F / orderOut;                     // G30 = F / order size (output units)
        r.trace = lib.name + ': ' + fmt(hr) + ' $/h (2017, ' + sc.scale + ') × ' + fmt(qty) + ' × ' + fmt(f, 6) + ' = ' + fmt(r.E) +
          ' $/h; × ' + fmt(sc.campaignHours) + ' h = ' + fmt(r.F) + ' $/campaign; ÷ ' + fmt(orderOut) + ' ' + out + ' = ' + fmt(r.G) + ' $/' + out;
      }
      rows.push(r);
    });
    var hasNA = rows.some(function (r) { return r.na; });
    var tot = { E: sumOk(rows.map(function (r) { return r.E; })), F: sumOk(rows.map(function (r) { return r.F; })), G: sumOk(rows.map(function (r) { return r.G; })) };

      warnings.push('Custom step list contains a step not available at this scale; the workbook shows "Check entries" and its processing-cost line becomes 0.' +

    return {
      template: tplName, isTemplate: isTpl, rows: rows, perHour: tot.E, perCampaign: tot.F, unitCost: unitTotal, warnings: warnings,
      escalation: f,
      trace: tplName + ': Σ ' + fmt(tot.E) + ' $/h × ' + fmt(sc.campaignHours) + ' h = ' + fmt(tot.F) + ' $/campaign ÷ ' + fmt(orderOut) + ' ' + out +
        ' = ' + fmt(unitTotal) + ' $/' + out + ' catalyst (PPI ' + ctx.basisYear + '/2017 = ' + fmt(f, 6) + ')'

  }

  // ---------- '4 Spent Catalyst' ----------
  /**
   * sc = {metal, support, metalWtPctOfAP (D8), bulkDensity (D9), densityUnit:'lb/ft3'|'kg/m3' (G9),
   *       reactor:'Fixed Bed'|'Slurry/Fluidized Bed' (D10), contaminants:'No'|'Yes' (D11), hazardClass (D12)}

  function spentCatalyst(sc, ctx, apWeightPercent) {
    var out = ctx.massUnit, outKg = kgOf(out), lbKg = kgOf('lb'), b = ctx.basisYear;
    var res = { lines: {}, value: 0, preciousExclusion: 0, warnings: [] };
    if (!sc) { res.trace = 'no spent catalyst inputs → SCV = 0'; return res; }
    if (ok(sc.value)) { res.value = sc.value; res.trace = 'user SCV ' + fmt(sc.value) + ' $/' + out; return res; }
    var I = idx(), feeYear = data().spent.feeYear, e16 = esc(feeYear, b);

    L.D17 = E(sc.metalWtPctOfAP / 100 * L.D16);
    L.D18 = bed ? bed.metalLoss[2] : null;                    // ave
    L.D19 = E(L.D16 * (100 - xnum(L.D18)) / 100); if (!bed) L.D19 = null;
    L.D20 = E(sc.metalWtPctOfAP / 100 * L.D19); if (L.D19 === null) L.D20 = null;
    L.D22 = 1 - apWeightPercent / 100;
    L.D23 = bed ? bed.supportLoss[2] : null;
    L.D24 = bed ? E(L.D22 * (100 - xnum(L.D23)) / 100) : null;
    L.D26 = sumOk([L.D19, L.D24]);
    var dens = du === 'lb/ft3' ? 1 : du === 'kg/m3' ? 0.45359237 / 28.31684659 * 1000 : NaN;
    L.D27 = E(L.D26 * outKg / lbKg / sc.bulkDensity * dens);   // ft3 per output unit of catalyst
    L.D31 = met ? met.refineLoss[2] : null;

    res.choice = choice;
    res.trace = (met ? met.metal : '?') + ' on ' + (sup ? sup.support : '?') + ': metal after use ' + fmt(L.D20) + ', recoverable ' + fmt(L.D32) + ' ' + out +
      '/' + out + ' × ' + fmt(L.D34) + ' $/' + out + ' = ' + fmt(L.D35) + ' $; fees ' + fmt(L.D41) + ' $; landfill ' + fmt(L.D44) + ' $; sale ' + fmt(L.D45) +
      ' $ → best: ' + choice + ', SCV = ' + fmt(res.value) + ' $/' + out + ' catalyst (fees ×PPI ' + b + '/' + feeYear + ')';

  }

  // ---------- '5a Summary Outputs' rows 21–37 ----------
  /**
   * input = {
   *   basisYear, massUnit:'kg', orderSizeTon (US short tons, 1–1000),
   *   prep?:{yieldType, yield, stoichRatio, apMW, apWeightPercent}, apWeightPercent?, wastePercent?:3,

  function estimate(input) {
    var ctx = {
      basisYear: input.basisYear, massUnit: input.massUnit || 'kg', orderTon: input.orderSizeTon,

    ppi(ctx.basisYear);

    var oh = input.overheads || {};
    var ga = oh.gaPercent === undefined ? 5 : oh.gaPercent;

      ['D32', 'Total overheads and margin', 'D29 + D30 + D31'],

    });
    return {
      credit: CREDIT, method: 'CatCost Step Method', basisYear: ctx.basisYear, massUnit: out, orderSizeTon: ctx.orderTon,
      orderSizeOut: ctx.orderOut, scale: ctx.scaleInfo, overheads: { gaPercent: ga, sardPercent: sard, marginPercent: mg },
      materials: mat, steps: st, spent: sp, lines: lines, cells: D,

      warnings: mat.warnings.concat(st.warnings, sp.warnings),
      summary: 'Catalyst purchase cost ' + fmt(D.D34 / outKg) + ' $/kg (' + ctx.basisYear + ' $), net of spent value ' + fmt(D.D37 / outKg) + ' $/kg'

    VERSION: VERSION, CREDIT: CREDIT, setData: setData,

  // Cost index (CEPCI, PPIACO) and BOT USD/THB: the same tables and rules as CAPEX Studio (data/capex_index_fx.json).
  const IDX = (typeof window !== 'undefined' && window.OPX_IDX) ? window.OPX_IDX
    : (typeof require !== 'undefined' ? require('../data/capex_index_fx.json') : null);
  DATA.idx = IDX;
  DATA.srcIndex = { turton: { value: 542, label: 'Turton Table 8.3, CEPCI 542 (2016)' }, aspen: { value: 797.9, label: 'APEA V14.2, 1st Qtr 2023 (CEPCI 2023 797.9)' } };
  const latestKey = o => Object.keys(o).sort().slice(-1)[0];
  const ymN = k => +k.slice(0, 4) * 12 + +k.slice(5, 7);
  function cepciFor(b) {
    b = b || {}; const c = IDX.cepci, p = IDX.ppi;
    if (b.mode === 'manual') return { value: +b.value, source: 'User value', estimated: false };
    if (b.mode === 'month') {
      const ym = b.ym;
      if (c.monthly[ym]) return { value: c.monthly[ym], source: `CEPCI ${ym} (${c.monthlyStatus[ym]})`, estimated: false };
      const anchor = Object.keys(c.monthly).filter(k => p.monthly[k]).sort((a, b2) => Math.abs(ymN(a) - ymN(ym)) - Math.abs(ymN(b2) - ymN(ym)))[0] || latestKey(c.monthly);
      if (p.monthly[ym] && p.monthly[anchor]) {
        const v = c.monthly[anchor] * p.monthly[ym] / p.monthly[anchor];
        return { value: v, estimated: true, source: `Estimated: CEPCI ${anchor} (${c.monthly[anchor]}) × PPIACO ${ym}/${anchor} (${p.monthly[ym]}/${p.monthly[anchor]})` };
      }
      b = { mode: 'annual', year: +ym.slice(0, 4) };
    }
    const yr = String(b.year || 2023);
    if (c.annual[yr]) return { value: c.annual[yr], source: 'CEPCI annual ' + yr, estimated: false };
    const last = Object.keys(c.annual).map(Number).sort((a, b2) => a - b2).pop();
    if (p.annual[yr] && p.annual[last]) return { value: c.annual[last] * p.annual[yr] / p.annual[last], estimated: true, source: `Estimated: CEPCI ${last} (${c.annual[last]}) × PPIACO ${yr}/${last}` };
    const mk = latestKey(c.monthly);
    return { value: c.monthly[mk], estimated: true, source: `No index for ${yr}; latest CEPCI ${mk} used` };
  }
  function fxFor(b) {
    b = b || {}; const f = IDX.fx, col = b.rate === 'ref' ? 0 : 1, name = b.rate === 'ref' ? 'reference rate' : 'mid rate';
    if (b.mode === 'manual') return { value: +b.value, source: 'User value' };
    if (b.mode === 'year') { const y = String(b.year); if (f.annual[y]) return { value: f.annual[y][col], source: `BOT annual average ${y}, ${name}` }; }
    let ym = b.ym || latestKey(f.monthly);
    if (!f.monthly[ym]) ym = latestKey(f.monthly);
    return { value: f.monthly[ym][col], source: `BOT monthly average ${ym}, ${name}` };
  }
  function defaultIndexBasis() {
    return { fxSet: { mode: 'month', ym: latestKey(IDX.fx.monthly), year: +latestKey(IDX.fx.annual), rate: 'mid', value: 33 },
      ci: { mode: 'month', ym: latestKey(IDX.cepci.monthly), year: +latestKey(IDX.cepci.annual), value: 800 }, escalate: true };
  }
  // Resolve the exchange rate and cost index into S.basis (fx, ci value, escalation factors). Call before evalAll.
  function applyBasis(S) {
    const B = S.basis;
    const fx = fxFor(B.fxSet), ci = cepciFor(B.ci);
    B.fx = fx.value; B.fxSource = fx.source; B.ciValue = ci.value; B.ciSource = ci.source; B.ciEstimated = !!ci.estimated;
    B.escT = B.escalate ? ci.value / DATA.srcIndex.turton.value : 1;
    B.escA = B.escalate ? ci.value / DATA.srcIndex.aspen.value : 1;
    return B;
  }

  // Turton Table 8.2 (typical multipliers)
  const TURTON = [
    { key: 'supervision', group: 'Direct', name: 'Supervisory and clerical labour', COL: 0.18 },
    { key: 'maintenance', group: 'Direct', name: 'Maintenance and repairs', FCI: 0.06 },
    { key: 'supplies', group: 'Direct', name: 'Operating supplies', FCI: 0.009 },
    { key: 'lab', group: 'Direct', name: 'Laboratory charges', COL: 0.15 },
    { key: 'patents', group: 'Direct', name: 'Patents and royalties', COM: 0.03 },
    { key: 'depreciation', group: 'Fixed', name: 'Depreciation', FCI: 0.10, depr: true },
    { key: 'taxins', group: 'Fixed', name: 'Local taxes and insurance', FCI: 0.032 },
    { key: 'overhead', group: 'Fixed', name: 'Plant overhead', COL: 0.708, FCI: 0.036 },
    { key: 'admin', group: 'General', name: 'Administration', COL: 0.177, FCI: 0.009 },
    { key: 'distribution', group: 'General', name: 'Distribution and selling', COM: 0.11 },
    { key: 'rnd', group: 'General', name: 'Research and development', COM: 0.05 }
  ];

  // ---------- unit handling ----------
  // flow unit -> [base unit for price, factor to base per hour]
  const FLOW = {
    'kg/h': ['t', 0.001], 't/h': ['t', 1], 't/d': ['t', 1 / 24],
    'm3/h': ['m3', 1], 'L/h': ['m3', 0.001], 'Nm3/h': ['Nm3', 1],
    'kW': ['kWh', 1], 'MW': ['kWh', 1000],
    'GJ/h': ['GJ', 1], 'MMBtu/h': ['GJ', 1.055056],
    't/yr': ['t', 1], 'unit/yr': ['unit', 1]
  };
  const ANNUAL_UNITS = { 't/yr': true, 'unit/yr': true };

  function annualQty(q, unit, hours) {
    const f = FLOW[unit];
    if (!f) throw new Error('unknown unit ' + unit);
    return ANNUAL_UNITS[unit] ? q * f[1] : q * f[1] * hours;
  }
  function priceBase(unit) { return FLOW[unit][0]; }

  // ---------- electricity ----------
  function elecPrice(o) {
    // o: {schedule, voltage, hours, peakDays, loadFactor, ft}
    const sch = DATA.elec.schedules[o.schedule];
    const r = sch.rows[o.voltage];
    const ft = o.ft == null ? DATA.elec.ft : o.ft;
    const lf = o.loadFactor || 1;
    const trace = [];
    let energy, demandPerKWh;
    if (sch.kind === 'TOU') {
      const peakH = 13 * o.peakDays; // 09:00-22:00 on working days
      const share = Math.min(peakH / 8760, 1);
      energy = share * r.peak + (1 - share) * r.off;
      demandPerKWh = r.demand * 12 / (o.hours * lf);
      trace.push(['Peak share of hours', `13 h x ${o.peakDays} d / 8760 h = ${share.toFixed(4)}`]);
      trace.push(['Energy charge', `${share.toFixed(4)} x ${r.peak} + ${(1 - share).toFixed(4)} x ${r.off} = ${energy.toFixed(4)} THB/kWh`]);
      trace.push(['Demand charge', `${r.demand} THB/kW-month x 12 / (${o.hours} h x LF ${lf}) = ${demandPerKWh.toFixed(4)} THB/kWh`]);
    } else {
      energy = r.energy;
      demandPerKWh = r.demandPeak * 12 / (o.hours * lf); // flat load: no partial-peak excess
      trace.push(['Energy charge', `${r.energy} THB/kWh (all periods)`]);
      trace.push(['Demand charge', `${r.demandPeak} THB/kW-month (peak) x 12 / (${o.hours} h x LF ${lf}) = ${demandPerKWh.toFixed(4)} THB/kWh; partial-peak charge 0 for a flat load`]);
    }
    const price = energy + demandPerKWh + ft;
    trace.push(['Ft', `${ft} THB/kWh`]);
    trace.push(['Blended price', `${price.toFixed(4)} THB/kWh (excl. VAT and service charge)`]);
    return { price, energy, demandPerKWh, ft, trace };
  }

  // ---------- fuel and steam ----------
  function fuelPerGJ(o) { // o: {ngPrice THB/MMBtu, adder THB/MMBtu}
    return (o.ngPrice + (o.adder || 0)) / DATA.gjPerMMBtu;
  }
  function steamPrice(level, o) {
    // o: {ngPrice, adder, eta, bfwCost THB/t, hBFW}
    const s = DATA.steam[level];
    const hb = o.hBFW == null ? DATA.hBFW105 : o.hBFW;
    const dh = (s.hg - hb) / 1000; // GJ per t steam
    const fuel = dh / o.eta;       // GJ fuel per t steam
    const fp = fuelPerGJ(o);
    const price = fuel * fp + (o.bfwCost || 0);
    return { price, trace: [
      ['Heat to steam', `(${s.hg} - ${hb}) kJ/kg = ${dh.toFixed(4)} GJ/t`],
      ['Fuel', `${dh.toFixed(4)} / eta ${o.eta} = ${fuel.toFixed(4)} GJ/t`],
      ['Fuel price', `(${o.ngPrice} + ${o.adder || 0}) THB/MMBtu / 1.055056 = ${fp.toFixed(2)} THB/GJ`],
      ['Steam price', `${fuel.toFixed(4)} x ${fp.toFixed(2)} + BFW ${o.bfwCost || 0} = ${price.toFixed(1)} THB/t`]
    ] };
  }

  // ---------- cooling water ----------
  function cwPrice(o) {
    // o: {dT, coc, drift, head, pumpEta, fanKWh, chem, water, elec}
    const E = 0.00153 * o.dT;
    const B = E / (o.coc - 1);
    const D = o.drift;
    const M = E + B + D;
    const pumpKWh = 1000 * 9.81 * o.head / o.pumpEta / 3.6e6;
    const cost = M * o.water + M * o.chem + (pumpKWh + o.fanKWh) * o.elec;
    const perGJ = cost / (4.186 * o.dT / 1000); // THB per GJ removed
    return { price: cost, perGJ, M, trace: [
      ['Evaporation', `0.00153 x dT ${o.dT} C = ${E.toFixed(5)} m3 per m3 circulated`],
      ['Blowdown', `E / (COC ${o.coc} - 1) = ${B.toFixed(5)}`],
      ['Drift', `${D}`],
      ['Make-up', `E + B + D = ${M.toFixed(5)} m3/m3`],
      ['Pump energy', `1000 x 9.81 x ${o.head} m / ${o.pumpEta} / 3.6e6 = ${pumpKWh.toFixed(4)} kWh/m3`],
      ['Cost', `${M.toFixed(5)} x (water ${o.water} + chemicals ${o.chem}) + (${pumpKWh.toFixed(4)} + fan ${o.fanKWh}) kWh x ${o.elec.toFixed(3)} = ${cost.toFixed(3)} THB/m3`],
      ['Per heat removed', `${cost.toFixed(3)} / (4.186 x ${o.dT} / 1000 GJ/m3) = ${perGJ.toFixed(1)} THB/GJ`]
    ] };
  }

  // ---------- labour ----------
  function nOL(P, Nnp) { return Math.sqrt(6.29 + 31.7 * P * P + 0.23 * Nnp); }
  function operators(P, Nnp, perPos, roundUp) {
    const x = perPos * nOL(P, Nnp);
    return roundUp ? Math.ceil(x - 1e-9) : x;
  }

  // ---------- COM ----------
  // inputs: {FCI, COL, CRM, CUT, CWT, site, mult: {key: {COL,FCI,COM}}, withDepr}
  function com(inp) {
    const items = TURTON.map(t => Object.assign({}, t, inp.mult && inp.mult[t.key] || {}));
    let fixed = 0, kCOM = 0;
    const lines = [];
    for (const it of items) {
      if (it.depr && !inp.withDepr) continue;
      const v = (it.COL || 0) * inp.COL + (it.FCI || 0) * inp.FCI;
      fixed += v; kCOM += it.COM || 0;
      lines.push({ key: it.key, group: it.group, name: it.name, base: v, COMfrac: it.COM || 0 });
    }
    const direct = inp.CRM + inp.CUT + inp.CWT + inp.COL + (inp.site || 0);
    const total = (direct + fixed) / (1 - kCOM);
    for (const l of lines) l.value = l.base + l.COMfrac * total;
    const textbook = 0.180 * inp.FCI + 2.73 * inp.COL + 1.23 * (inp.CUT + inp.CWT + inp.CRM)
      + (inp.withDepr ? 0.10 * inp.FCI : 0);
    return { total, lines, direct, kCOM, textbook,
      coef: { FCI: items.filter(i => !i.depr || inp.withDepr).reduce((a, i) => a + (i.FCI || 0), 0) / (1 - kCOM),
              COL: (1 + items.reduce((a, i) => a + (i.COL || 0), 0)) / (1 - kCOM),
              raw: 1 / (1 - kCOM) } };
  }

  // ---------- one case ----------
  function turtonPrices(S) {
    const T = DATA.turton, fx = S.basis.fx * (S.basis.escT || 1), cr = S.util.turtonCredit ? 'credit' : 'nocredit';
    return {
      elec: T.elec * fx, steam_LP: T.steam.LP[cr] * fx, steam_MP: T.steam.MP[cr] * fx, steam_HP: T.steam.HP[cr] * fx,
      cw: T.cw * fx, water: T.water * fx, ng: T.ng * fx, ia: T.ia * fx,
      waste_haz: (T.wasteHazLow + T.wasteHazHigh) / 2 * fx, waste_non: T.wasteNonHaz * fx, waste_ww: T.wastewater.secondary * fx,
      operator: T.operator * fx
    };
  }

  function evalCase(S, c, basisSet) {
    const bs = basisSet || S.basisSet || 'thai';
    const h = S.basis.hours;
    const U = S.util;
    const elec = elecPrice({ schedule: U.elec.schedule, voltage: U.elec.voltage, hours: h,
      peakDays: U.elec.peakDays, loadFactor: U.elec.loadFactor, ft: U.elec.ft });
    const elecUse = U.elec.mode === 'avg' ? DATA.elec.avgBilled : (U.elec.mode === 'manual' ? U.elec.manual : elec.price);
    const st = {}; for (const L of ['LP', 'MP', 'HP']) st[L] = steamPrice(L, U.steam);
    const cw = cwPrice(Object.assign({}, U.cw, { elec: elecUse }));
    const derived = bs === 'turton' ? turtonPrices(S) : {
      elec: elecUse, steam_LP: st.LP.price, steam_MP: st.MP.price, steam_HP: st.HP.price,
      cw: cw.price, water: U.water, ng: fuelPerGJ(U.steam), ia: U.iaKWh * elecUse,
      waste_haz: DATA.wasteHaz, waste_non: DATA.wasteNonHaz, waste_ww: DATA.wastewater,
      operator: S.labour.costPerOp
    };
    const out = { materials: [], utilities: [], waste: [], derived, traces: { elec: elec.trace, LP: st.LP.trace, MP: st.MP.trace, HP: st.HP.trace, cw: cw.trace } };
    let CRM = 0, REV = 0;
    for (const m of S.materials) {
      const q = m.q[c] || 0;
      const a = annualQty(q, m.unit, h);
      const v = a * (m.price || 0);
      out.materials.push({ id: m.id, annualQty: a, value: v });
      if (m.role === 'feed') CRM += v; else REV += v;
    }
    let CUT = 0;
    for (const u of S.utilities) {
      const q = u.q[c] || 0;
      const a = annualQty(q, u.unit, h);
      const p = (u.priceMode === 'derived' && derived[u.type] != null) ? derived[u.type] : (u.price || 0);
      const v = a * p * (u.credit ? -1 : 1);
      out.utilities.push({ id: u.id, annualQty: a, price: p, value: v });
      CUT += v;
    }
    let CWT = 0;
    for (const w of S.waste) {
      const q = w.q[c] || 0;
      const a = annualQty(q, w.unit, h);
      const wp = (w.priceMode === 'derived' && derived['waste_' + w.kind] != null) ? derived['waste_' + w.kind] : (w.price || 0);
      const v = a * wp;
      out.waste.push({ id: w.id, annualQty: a, price: wp, value: v });
      CWT += v;
    }
    const L = S.labour;
    const P = L.P[c] || 0, Nnp = L.Nnp[c] || 0;
    const nol = nOL(P, Nnp);
    const ops = operators(P, Nnp, L.perPos, L.roundUp);
    const extra = (L.extra || []).reduce((a, e) => a + (e.n[c] || 0) * e.cost, 0);
    const COL = ops * derived.operator + extra;
    const site = (S.site.rai || 0) * (S.site.cam || 0) * 12 + (S.site.leaseOn ? (S.site.rai || 0) * (S.site.lease || 0) : 0);
    const FCI = S.fci[c] || 0;
    const r = com({ FCI, COL, CRM, CUT, CWT, site, mult: S.mult, withDepr: S.withDepr });
    const prod = S.product && S.product.q ? annualQty(S.product.q[c] || 0, S.product.unit, h) : 0;
    const asp = aspenOpex(S, { CRM, CUT, CWT, site, FCI, nol, bs, h });
    return Object.assign(out, { basisSet: bs, CRM, REV, CUT, CWT, COL, site, FCI, nol, ops, extra, com: r, aspen: asp,
      margin: REV - r.total, prodAnnual: prod,
      perUnit: prod > 0 ? r.total / prod : null, perHour: r.total / h });
  }

  // Aspen Process Economic Analyzer structure (V14.2 User Guide):
  // operating labor = (operators/shift x operator rate + supervisors/shift x supervisor rate) x operating hours;
  // maintenance = % of FCI (APEA itself sums equipment-based values); operating charges = % of operating labor;
  // plant overhead = % of (operating labor + maintenance); subtotal = raw materials + labor + utilities + maintenance
  // + operating charges + plant overhead; G and A = % of subtotal; total operating cost = subtotal + G and A.
  function aspenOpex(S, x) {
    const A = Object.assign({}, DATA.aspen, S.aspen || {});
    const fx = S.basis.fx * (S.basis.escA || 1);
    const ops = A.opsPerShift > 0 ? A.opsPerShift : Math.ceil(x.nol - 1e-9);
    const sup = A.supPerShift != null ? A.supPerShift : 1;
    const rOp = x.bs === 'turton' ? A.opRateUSD * fx : A.opRateTHB;
    const rSup = x.bs === 'turton' ? A.supRateUSD * fx : A.supRateTHB;
    const labor = (ops * rOp + sup * rSup) * x.h;
    const maint = A.maintPct * x.FCI;
    const opCharges = A.opChargesPct * labor;
    const overhead = A.overheadPct * (labor + maint);
    const other = x.CWT + x.site; // APEA has no separate lines: entered as utilities/raw materials
    const subtotal = x.CRM + labor + x.CUT + maint + opCharges + overhead + other;
    const ga = A.gaPct * subtotal;
    return { ops, sup, rOp, rSup, labor, maint, opCharges, overhead, other, subtotal, ga, total: subtotal + ga };
  }

  // ---------- formulated / consumer product: bill of materials per SKU (cost per unit sold) ----------
  // Cussler & Moggridge §5.4-3; RSC formula-cost sheet (finished product cost per pack = raw materials + processing);
  // COGS = ingredients + packaging + filling/conversion + QC (+ factory overhead); development and pack design are opex.
  function bomCalc(k, wageTHBh) {
    const units = Math.max(0, +k.units || 0);
    const kgPerUnit = (k.fillUnit === 'mL' ? k.fill * (k.density || 1) : k.fill) / 1000; // g or mL -> kg
    const pctSum = k.formula.reduce((a, f) => a + (+f.pct || 0), 0);
    const costPerKg = k.formula.reduce((a, f) => a + (+f.pct || 0) / 100 * (+f.price || 0), 0);
    const formulaKgUnit = kgPerUnit * (1 + (k.loss || 0) / 100);
    const ingredients = formulaKgUnit * costPerKg;
    const pack = k.pack.reduce((a, p) => a + (+p.cost || 0) / Math.max(1, +p.per || 1), 0);
    const wage = k.wage > 0 ? k.wage : wageTHBh;
    const kgYr = units * formulaKgUnit;
    const batches = k.mix.batchKg > 0 ? Math.ceil(kgYr / k.mix.batchKg - 1e-9) : 0;
    const mixLabour = batches * k.mix.hours * k.mix.crew * wage;
    const qc = batches * (k.qcPerBatch || 0);
    const fillHours = k.line.speed > 0 && k.line.eff > 0 ? units / (k.line.speed * 60 * k.line.eff) : 0;
    const fillLabour = fillHours * k.line.crew * wage;
    const machine = (fillHours + batches * k.mix.hours) * (k.line.machineRate || 0);
    const change = (k.changeovers || 0) * (k.changeHours || 0) * k.line.crew * wage;
    const conversionYr = mixLabour + fillLabour + machine + change;
    const u = v => units > 0 ? v / units : 0;
    const conversion = u(conversionYr), qcU = u(qc);
    const overhead = (k.overheadPct || 0) / 100 * conversion;
    const cogs = ingredients + pack + conversion + qcU + overhead;
    // price waterfall: shelf price incl. VAT -> ex VAT -> retailer margin -> distributor margin -> ex-factory
    const W = k.waterfall || {};
    const exVat = (k.shelf || 0) / (1 + (W.vat || 0) / 100);
    const toDistributor = exVat * (1 - (W.retail || 0) / 100);
    const exFactory = toDistributor * (1 - (W.dist || 0) / 100);
    const gross = exFactory - cogs;
    const selling = (W.selling || 0) / 100 * exFactory, ga = (W.ga || 0) / 100 * exFactory;
    const operating = gross - selling - ga;
    return { units, kgPerUnit, formulaKgUnit, pctSum, costPerKg, ingredients, pack, wage, kgYr, batches, mixLabour, qc, fillHours, fillLabour, machine, change,
      conversionYr, conversion, qcU, overhead, cogs, exVat, toDistributor, exFactory, vat: (k.shelf || 0) - exVat, retail: exVat - toDistributor, dist: toDistributor - exFactory,
      gross, grossPct: exFactory > 0 ? gross / exFactory : null, selling, ga, operating, operatingPct: exFactory > 0 ? operating / exFactory : null,
      annual: { cogs: cogs * units, revenue: exFactory * units, gross: gross * units, operating: operating * units, ingredients: ingredients * units, pack: pack * units } };
  }

  // ---------- fine / specialty: batch and campaign costing, cost per kg (Turton Ch 3; Bioseparations Ch 11; Brennan; Tayyari ABC) ----------
  function batchCalc(k, prices, wageTHBh, hoursYr) {
    const wage = k.wage > 0 ? k.wage : wageTHBh;
    const good = k.batchKg * (1 - (k.offspec || 0) / 100);               // saleable kg per batch
    const batches = good > 0 ? Math.ceil((k.demand || 0) / good - 1e-9) : 0;
    const perCamp = Math.max(1, k.perCampaign || 1);
    const campaigns = batches > 0 ? Math.ceil(batches / perCamp - 1e-9) : 0;
    const produced = batches * good;
    // equipment occupancy per batch
    const occ = {}; let tbatch = 0, opHours = 0;
    for (const st of k.steps) { const h = +st.hours || 0; occ[st.vessel || '-'] = (occ[st.vessel || '-'] || 0) + h; tbatch += h; opHours += h * (+st.ops || 0); }
    const vessels = Object.keys(occ), tcycle = vessels.length ? Math.max(...vessels.map(v => occ[v])) : 0;
    const bottleneck = vessels.find(v => occ[v] === tcycle) || '';
    const plantHours = batches > 0 ? (batches - campaigns) * tcycle + campaigns * (tbatch + (k.changeHours || 0)) : 0;
    const util = hoursYr > 0 ? plantHours / hoursYr : null;
    const maxBatches = tcycle > 0 ? Math.floor((hoursYr - campaigns * (tbatch - tcycle + (k.changeHours || 0))) / tcycle) : 0;
    // per batch
    const rm = k.recipe.reduce((a, x) => a + (+x.kg || 0) * (+x.price || 0), 0);
    const ut = k.utils.reduce((a, x) => a + (+x.qty || 0) * (prices[x.type] != null ? prices[x.type] : (+x.price || 0)), 0);
    const lab = opHours * wage;
    const qc = +k.qcPerBatch || 0, cons = +k.consPerBatch || 0, waste = (+k.wasteKg || 0) * (+k.wastePrice || 0) / 1000;
    // per campaign: cleaning / changeover
    const clean = (k.changeHours || 0) * (k.cleanCrew || 0) * wage + (+k.cleanMat || 0);
    // facility cost shared by activity: THB per vessel-hour
    const fac = (k.plantFCI || 0) * (1 / Math.max(1, k.deprYears || 10) + (k.maintPct || 0) / 100 + (k.insPct || 0) / 100);

function sig3(v) { // 3 significant figures, keeps thousands separators
  if (v == null || !isFinite(v)) return '–';
  if (v === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(v))) - 2;
  const r = e >= 0 ? Math.round(v / 10 ** e) * 10 ** e : Math.round(v * 10 ** -e) / 10 ** -e;
  return r.toLocaleString('en-US', { maximumFractionDigits: Math.max(0, -e), minimumFractionDigits: 0 });
}

// ---------- cost stream: where the money goes (same colours as the COM page) ----------
let NORM = false;
const GROUP_PAGE = ['materials', 'utilities', 'labour', 'com', 'com', 'com', 'waste'];
function stream() {
  const cs = cases();
  const G = costGroups().map((g, j) => g.concat([GROUP_PAGE[j]]));
  const GR = NORM ? G.slice(1) : G;
  const tot = r => GR.reduce((a, g) => a + Math.max(0, g[2](r)), 0) || 1;
  const M = v => sig3(toShow(v) / 1e6);
  const rows = cs.map(c => {
    const r = R.res[c], T = tot(r);
    const seg = GR.map(g => { const v = g[2](r); return v > 0 ? `<a href="#${g[3]}" style="--g:${g[1]};flex:${v / T}" title="${g[0]}: ${M(v)} M${cur()}/yr (${(v / T * 100).toFixed(1)} %)" aria-label="${g[0]} ${M(v)} M${cur()} per year"></a>` : ''; }).join('');
    return `<div class="srow${cs.length > 1 && c === 'project' ? ' thin' : ''}"><span class="cap">${CASE_LABEL[c]}</span><div class="ribbon" role="img" aria-label="${CASE_LABEL[c]} cost split">${seg}</div></div>`;
  }).join('');
  const b = R.res.base, T = tot(b);
  const pcf = x => x < 0.995 && x > 0 ? x.toFixed(1) : x.toFixed(0);
  const key = GR.map(g => { const v = g[2](b); return `<a href="#${g[3]}" style="--g:${g[1]}"><i></i>${g[0]} <b>${pcf(v / T * 100)} %</b><span class="sv">${M(v)} · ${sig3(toOther(v) / 1e6)} M${oc()}</span></a>`; }).join('');
  return `<div class="card stream"><div class="shead"><h3>Where the money goes${NORM ? ', raw materials left out' : ''}</h3>${seg('norm', NORM ? 1 : 0, [[0, 'All costs'], [1, 'Without raw materials']], 'Cost stream view')}</div>${rows}<div class="skey">${key}</div>
    <p class="note">Click a colour to open the page where that cost is entered. Values in M${cur()}/yr, then M${oc()}/yr.</p></div>`;
}

function kpis() {
  const cs = cases(); const b = R.res.base, pj = R.res.project;
  const unitLab = S.product.name ? `per t ${esc(S.product.name)}` : 'per t product';
  const M = v => sig3(toShow(v) / 1e6);
  const thb = v => ` · ${(v > 0 && v === v) ? '' : ''}${sig3(toOther(v) / 1e6)} M${oc()}/yr`;
  const sub = S.withDepr ? '' : '<sub>d</sub>';
  const tag = cs.length > 1 ? ' · base' : '';
  let h = `<div class="kpi"><div class="l">${icon('com')}<span>COM${sub}${tag}</span></div><div class="v">${M(b.com.total)}<small>M${cur()}/yr</small></div><div class="s">${sig3(toShow(b.perHour))} ${cur()}/h${thb(b.com.total)}</div></div>`;
  h += `<div class="kpi"><div class="l">${icon('coin')}<span>Cost ${unitLab}${tag}</span></div><div class="v">${b.perUnit == null ? '–' : sig3(toShow(b.perUnit))}<small>${cur()}/t</small></div><div class="s">${b.perUnit != null ? sig3(toOther(b.perUnit)) + ' ' + oc() + '/t · ' : ''}all COM${sub} over the main product</div></div>`;
  h += `<div class="kpi ${b.margin < 0 ? 'bad' : ''}"><div class="l">${icon('trend')}<span>Revenue − COM${sub}${tag}</span></div><div class="v">${M(b.margin)}<small>M${cur()}/yr</small></div><div class="s">${sig3(toOther(b.margin) / 1e6)} M${oc()}/yr · ${b.REV > 0 ? sig3(b.margin / b.REV * 100) + ' % of revenue' : 'no products entered'}</div></div>`;
  if (pj) {
    const d = pj.com.total - b.com.total;
    h += `<div class="kpi ${d < 0 ? 'good' : d > 0 ? 'bad' : ''}"><div class="l">${icon('compare')}<span>ΔCOM project − base</span></div><div class="v ${dcls(d)}">${d > 0 ? '+' : ''}${M(d)}<small>M${cur()}/yr</small></div><div class="s">${d < 0 ? 'saving' : d > 0 ? 'cost increase' : 'no change'}${thb(d)} · ${sig3(d / b.com.total * 100)} %</div></div>`;
  }
  return `<div class="kpis">${h}</div>` + stream();
}

function caseHeads(extra) {

function valueCells(arr, id, key) {

function totRow(label, span, vals) {

function pCom() {
  const cs = cases();

  ];
  for (const t of X.TURTON) {
    if (t.depr && !S.withDepr) continue;
    const m = Object.assign({}, t, S.mult[t.key] || {});
    const basis = [m.COL ? `${m.COL} C<sub>OL</sub>` : '', m.FCI ? `${m.FCI} FCI` : '', m.COM ? `${m.COM} COM` : ''].filter(Boolean).join(' + ');
    rows.push([`${t.name} <span class="note">${t.group} · ${basis}</span>`, r => L(r)[t.key]]);
  }
  const body = rows.map(([lab, f]) => {
    const v = cs.map(c => f(R.res[c]));
    return `<tr><td>${lab}</td>${v.map(x => `<td class="num">${mega(x)}</td>`).join('')}${cs.length > 1 ? `<td class="num ${dcls(v[1] - v[0])}">${delta(v[1] - v[0])}</td>` : ''}</tr>`;
  }).join('');
  const tot = cs.map(c => R.res[c].com.total), tb = cs.map(c => R.res[c].com.textbook);

  return header(`Cost of manufacturing${S.withDepr ? '' : ' without depreciation'}`, 'Turton Table 8.2 solved exactly: the items that are a share of COM appear on both sides, so COM is found by dividing by (1 − Σ shares). The textbook rounded equation is shown beside it for checking.') +

   ${totRow(`COM${S.withDepr ? '' : '<sub>d</sub>'} (exact)`, 1, tot).replace('<td></td></tr>', '</tr>')}

function pCompare() {
  const cs = cases(); const c0 = 'base';

  const L = r => Object.fromEntries(r.com.lines.map(l => [l.key, l.value]));
  const lines = [
    ['Raw materials', r => r.CRM, r => r.CRM, 'Same flows and prices in both methods.'],
    ['Utilities', r => r.CUT, r => r.CUT, 'Same flows; prices change with the price basis.'],
    ['Waste and site charges', r => r.CWT + r.site, r => r.aspen.other, 'APEA has no waste line: enter waste as a utility or raw material.'],
    ['Operating labour', r => r.COL, r => r.aspen.labor, 'Turton hires 4.5 people per position, each paid a year; APEA pays operators and supervisors per shift for the operating hours only.'],
    ['Supervision and laboratory', r => L(r).supervision + L(r).lab, r => 0, 'Turton 0.18 + 0.15 of C_OL. APEA puts supervisors in labour and the laboratory in operating charges.'],
    ['Maintenance and supplies', r => L(r).maintenance + L(r).supplies, r => r.aspen.maint, 'Turton 0.06 + 0.009 FCI. APEA sums equipment-based maintenance (typically 2–10 % FCI); here % FCI.'],

    ['Plant overhead', r => L(r).overhead, r => r.aspen.overhead, 'Turton 0.708 C_OL + 0.036 FCI; APEA % of (labour + maintenance).'],
    ['Local taxes and insurance', r => L(r).taxins, r => 0, 'Turton 0.032 FCI; not an operating-cost line in APEA.'],
    ['Administration, distribution, R&D, royalties', r => L(r).admin + L(r).distribution + L(r).rnd + L(r).patents, r => r.aspen.ga, 'Turton: admin + 0.19 COM; APEA: G and A as % of the subtotal.']
  ];
  const val = (col, ln) => col[2] === 'aspen' ? ln[2](col[1]) : ln[1](col[1]);
  const tot = col => col[2] === 'aspen' ? col[1].aspen.total : col[1].com.total;
  const body = lines.map(ln => `<tr><td>${ln[0]}<div class="note">${ln[3]}</div></td>${cols.map(col => `<td class="num">${mega(val(col, ln))}</td>`).join('')}</tr>`).join('');

  `<div class="card"><div class="tw"><table><thead><tr><th>M${cur()}/yr</th>${cols.map(c => `<th class="num">${c[0]}</th>`).join('')}</tr></thead><tbody>${body}
   <tr class="tot"><td>Total operating cost</td>${cols.map(c => `<td class="num">${mega(tot(c))}</td>`).join('')}</tr>
   <tr><td>Cost per t ${esc(S.product.name)}, ${cur()}/t</td>${cols.map(c => `<td class="num">${prod > 0 ? money(tot(c) / prod) : '–'}</td>`).join('')}</tr>
   <tr><td>Ratio to Turton · Thai</td>${cols.map(c => `<td class="num">${num(tot(c) / tot(cols[0]), 3)}</td>`).join('')}</tr></tbody></table></div>
   <p class="note">Questions for class: which lines move with the price basis and which with the method? Why is APEA labour lower for the same plant? Which method charges more when raw materials dominate, and why (Turton's 0.19 COM shares against APEA's G and A on the subtotal)?</p></div>
  <div class="grid2"><div class="card"><h3>How Aspen builds operating cost</h3><ol class="note">
   <li>Raw materials, products and utilities from the simulator streams × unit costs (Operating Unit Costs, Utility Specifications).</li>
   <li>Operating labour = operators per shift × operator rate + supervisors per shift × supervisor rate, × operating hours per period. APEA sets the number per shift from the equipment, facility type and operating mode.</li>
   <li>Maintenance from the equipment (labour and materials), reported as % of FCI (typical 2–10 %).</li>
   <li>Operating charges = % of operating labour (operating supplies + laboratory).</li>
   <li>Plant overhead = % of (operating labour + maintenance).</li>
   <li>Subtotal = raw materials + operating labour + utilities + maintenance + operating charges + plant overhead.</li>
   <li>G and A = % of the subtotal (administration, R&D, distribution and selling).</li>
   <li>Total operating cost = subtotal + G and A. Depreciation, taxes and insurance are handled in the cash flow, not here.</li></ol>
   <p class="note">Source: Aspen Process Economic Analyzer V14.2 User Guide, Ch.3 Investment Parameters and Operating Unit Costs (pp.125–128) and Ch.11 Project Summary (pp.463–464). Rates 20 USD/h (operator) and 35 USD/h (supervisor), operating charges 25 % and plant overhead 50 % are the APEA defaults reported by users of the software; the guide does not print them. G and A 8 % was read in APEA itself (Project Basis → Investment Parameters).</p></div>

   ${field('Operator rate, THB/h ' + A_, inp('opRateTHB', 1), 'Thai: 420,000 THB/yr ÷ 2080 h')}

   ${field('Supervisor rate, USD/h', inp('supRateUSD', 0.5))}

   ${field('Plant overhead, fraction of labour + maintenance', inp('overheadPct', 0.01))}
   ${field('G and A, fraction of subtotal (check in APEA)', inp('gaPct', 0.005))}
  </div></div></div>`;
}

    steps: C.stepMode === 'template' ? C.template : C.steps.map(x => ({ step: x.step, qty: Number(x.qty) })),

function costGroups() {
  const L = r => Object.fromEntries(r.com.lines.map(l => [l.key, l.value]));
  return [['Raw materials', 'var(--c1)', r => r.CRM], ['Utilities', 'var(--c2)', r => r.CUT], ['Labour-linked', 'var(--c3)', r => r.COL + (L(r).supervision || 0) + (L(r).lab || 0)],
    ['FCI-linked', 'var(--c4)', r => (L(r).maintenance || 0) + (L(r).supplies || 0) + (L(r).taxins || 0) + (L(r).depreciation || 0)],
    ['Overhead and admin', 'var(--c5)', r => (L(r).overhead || 0) + (L(r).admin || 0)], ['Sales, R&D, royalties', 'var(--c6)', r => (L(r).distribution || 0) + (L(r).rnd || 0) + (L(r).patents || 0)],
    ['Waste and site', 'var(--c7)', r => r.CWT + r.site]];
}
function donut(r, size) {
  const G = costGroups(), T = r.com.total, R0 = size / 2, rr = R0 - 14, c = 2 * Math.PI * rr;
  let off = 0;
  const arcs = G.map(g => { const f = Math.max(0, g[2](r) / T); const a = `<circle cx="${R0}" cy="${R0}" r="${rr}" fill="none" stroke="${g[1]}" stroke-width="22" stroke-dasharray="${(f * c).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-off * c).toFixed(2)}" transform="rotate(-90 ${R0} ${R0})"><title>${g[0]} ${sig3(f * 100)} %</title></circle>`; off += f; return a; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="COM split"><circle cx="${R0}" cy="${R0}" r="${rr}" fill="none" stroke="var(--line-2)" stroke-width="22"/>${arcs}
    <text x="${R0}" y="${R0 - 4}" text-anchor="middle" font-family="var(--font-mono)" font-size="20" font-weight="600" fill="var(--ink)">${sig3(toShow(T) / 1e6)}</text>
    <text x="${R0}" y="${R0 + 16}" text-anchor="middle" font-size="11.5" fill="var(--muted)">M${cur()}/yr</text>
    <text x="${R0}" y="${R0 + 32}" text-anchor="middle" font-size="11" fill="var(--muted)">${sig3(toOther(T) / 1e6)} M${oc()}</text></svg>`;
}
function pOverview() {
  const tr = typeResult(); if (tr) return pOverviewType(tr);
  const cs = cases(), b = R.res.base, pj = R.res.project, G = costGroups(), T = b.com.total;
  const leg = G.map(g => `<div><i style="background:${g[1]}"></i><span>${g[0]}</span><span class="m">${sig3(toShow(g[2](b)) / 1e6)}<span class="alt">${sig3(toOther(g[2](b)) / 1e6)} M${oc()}</span></span><span class="p">${sig3(g[2](b) / T * 100)}%</span></div>`).join('');
  // utilities bars
  const us = S.utilities.map(u => ({ n: u.name, b: b.utilities.find(x => x.id === u.id).value, p: pj ? pj.utilities.find(x => x.id === u.id).value : null })).sort((x, y) => y.b - x.b);
  const umax = Math.max(1, ...us.map(x => Math.max(x.b, x.p || 0)));
  const ubars = us.length ? us.map(x => `<div class="hbar"><span>${esc(x.n)}</span><div class="track"><span style="width:${x.b / umax * 100}%"></span>${x.p != null ? `<span class="ghost" style="width:${x.p / umax * 100}%"></span>` : ''}</div><span class="val">${sig3(toShow(x.b) / 1e6)}${x.p != null ? ` → ${sig3(toShow(x.p) / 1e6)}` : ''}<span class="alt" style="display:block;white-space:normal">${sig3(toOther(x.b) / 1e6)}${x.p != null ? ` → ${sig3(toOther(x.p) / 1e6)}` : ''} M${oc()}</span></span></div>`).join('') : '<p class="note">No utilities entered.</p>';
  // delta by group (improve)
  let dcard = '';
  if (pj) {
    const ds = G.map(g => ({ n: g[0], c: g[1], d: g[2](pj) - g[2](b) })).filter(x => Math.abs(x.d) > 1e-6);
    const dmax = Math.max(1, ...ds.map(x => Math.abs(x.d)));
    dcard = `<div class="card"><h3>${icon('compare')}What the project changes</h3><div class="sub">ΔCOM by group, M${cur()}/yr · total ${(pj.com.total - T) > 0 ? '+' : ''}${sig3(toShow(pj.com.total - T) / 1e6)} (${sig3(toOther(pj.com.total - T) / 1e6)} M${oc()})</div>
      <div class="hbars">${ds.length ? ds.map(x => `<div class="hbar"><span>${x.n}</span><div class="track" style="background:transparent;border-left:1px solid var(--muted)">${x.d < 0 ? `<span style="width:${-x.d / dmax * 100}%;background:var(--good)"></span>` : `<span style="width:${x.d / dmax * 100}%;background:var(--bad)"></span>`}</div><span class="val ${dcls(x.d)}">${x.d > 0 ? '+' : ''}${sig3(toShow(x.d) / 1e6)}</span></div>`).join('') : '<p class="note">Base and project are the same.</p>'}</div>
      <p class="note">Green = saving. Lines that scale with COM (sales, R&D, royalties) move with every other saving.</p></div>`;
  }
  const done = k => ({ materials: S.materials.length, utilities: S.utilities.length, labour: b.ops, waste: S.waste.length + (S.site.rai ? 1 : 0), catalyst: S.materials.filter(m => /catalyst/i.test(m.name)).length })[k];
  const stepsHtml = [['start', 'Job and basis', S.basisSet === 'turton' ? 'Turton prices' : 'Thai prices'], ['materials', 'Materials', `${done('materials')} streams`], ['utilities', 'Utilities', `${done('utilities')} utilities`],
    ['labour', 'Labour', `${b.ops} operators`], ['waste', 'Waste and site', `${S.waste.length} streams · ${S.site.rai} rai`], ['catalyst', 'Catalyst price', 'CatCost estimate'],
    ['com', 'Cost of manufacturing', `${sig3(toShow(T) / 1e6)} M${cur()}/yr · ${sig3(toOther(T) / 1e6)} M${oc()}`], ['compare', 'Compare methods', `Aspen ${sig3(R.alt.base.thai.aspen.total / R.alt.base.thai.com.total)} × Turton`]]
    .map(([k, l, v]) => `<a href="#${k}"><b>${icon(k)}${l}</b><span>${v}</span></a>`).join('');
  return header('Overview', `${esc(JOBS[S.job].d)} The numbers below update as you edit any page.`) +
  `<div class="ov"><div class="card"><h3>${icon('com')}Where the money goes</h3><div class="sub">COM${S.withDepr ? '' : '<sub>d</sub>'}${cs.length > 1 ? ', base case' : ''}, M${cur()}/yr and share</div>
     <div class="donutwrap">${donut(b, 210)}<div class="donut-legend">${leg}</div></div></div>
   <div class="card"><h3>${icon('utilities')}Utilities by cost</h3><div class="sub">M${cur()}/yr${pj ? ' · solid = base, dashed = project' : ''}</div><div class="hbars">${ubars}</div></div></div>
  ${dcard}
  <div class="card"><h3>${icon('start')}Work through the steps</h3><div class="steps">${stepsHtml}</div></div>`;
}

// ---------- product-type result: one summary object for Overview, Report, CSV and copy ----------
function typeResult() {
  const pt = S.productType; if (pt === 'commodity') return null;
  const wage = S.labour.costPerOp / 2080, P = PRODUCTS[pt];
  if (pt === 'fine') {
    const k = S.batch, r = X.batchCalc(k, R.res.base.derived, wage, S.basis.hours), n = r.produced || 1;
    const parts = [['Raw materials', r.annual.rm, 'var(--c1)'], ['Utilities', r.annual.ut, 'var(--c2)'], ['Labour incl. cleaning crew', r.annual.lab, 'var(--c3)'], ['QC release', r.annual.qc, 'var(--c4)'],
      ['Consumables and waste', r.annual.cons, 'var(--c6)'], ['Cleaning materials', r.annual.clean, 'var(--c7)'], ['Facility (ABC, vessel-hours)', r.annual.facility, 'var(--c5)'], ['Plant overhead', r.annual.overhead, 'var(--muted)']];
    return { pt, P, page: 'batch', pageLab: 'Batch and campaign', name: k.name, unit: 'kg', qty: r.produced, qtyLab: `${sig3(r.produced / 1000)} t/yr good product`, perUnit: r.perKg, price: k.price,
      annualCost: r.total, revenue: r.revenue, gross: r.gross, grossPct: r.grossPct, parts, perDiv: n,
      facts: [['Batches per year', `${r.batches} in ${r.campaigns} campaigns`], ['Good product per batch', `${sig3(r.good)} kg`], ['Cycle time', `${sig3(r.tcycle)} h, bottleneck ${esc(r.bottleneck)}`],
        ['Plant time used', `${sig3(r.util * 100)} % of ${S.basis.hours.toLocaleString()} h (max about ${r.maxBatches} batches/yr)`], ['Facility rate', `${sig3(r.rate)} THB per vessel-hour, ${sig3(r.vh)} vessel-h used`]] };
  }
  if (pt === 'formulated') {
    const list = S.bom.skus.map(k => ({ k, r: X.bomCalc(k, wage) }));
    const sum = f => list.reduce((a, x) => a + f(x), 0);

function donutParts(parts, size, centre) {

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Cost split"><circle cx="${R0}" cy="${R0}" r="${rr}" fill="none" stroke="var(--line-2)" stroke-width="22"/>${arcs}
    <text x="${R0}" y="${R0 - 4}" text-anchor="middle" font-family="var(--font-mono)" font-size="20" font-weight="600" fill="var(--ink)">${centre[0]}</text>

}

   <div class="kpi"><div class="l">${icon('compare')}<span>Aspen ÷ Thai, geometric mean</span></div><div class="v">${sig3(gm(m))}<small>×</small></div><div class="s">over ${m.length} items with a non-zero APEA default</div></div></div>
  <div class="card"><h3>Unit prices by source</h3><div class="tw"><table class="uptab"><thead><tr><th>Item</th><th>Unit</th><th class="num">Thai 2026</th><th class="num">Turton ${S.basis.escalate ? '→ CEPCI ' + sig3(S.basis.ciValue) : '2016'}</th><th class="num">Aspen ${S.basis.escalate ? '→ CEPCI ' + sig3(S.basis.ciValue) : '1Q 2023'}</th><th class="num">Turton ÷ Thai</th><th class="num">Aspen ÷ Thai</th></tr></thead><tbody>${body}</tbody></table></div>

  <div class="card"><h3>How far apart (log scale, Thai = 1×)</h3><div class="rleg"><span><i class="rdot tu"></i>Turton</span><span><i class="rdot as"></i>Aspen</span></div>

  const how = {

   ${kp('trend', 'Plant time used', r.util == null ? '–' : sig3(r.util * 100), '%', `${sig3(r.plantHours)} of ${S.basis.hours.toLocaleString()} h · max about ${r.maxBatches} batches/yr`, cap)}</div>
  <div class="card stream"><h3>Cost per kg, ${sig3(toShow(r.perKg))} ${cur()}/kg</h3><div class="srow"><span class="cap">Per kg</span><div class="ribbon" role="img" aria-label="Cost per kg build-up">${ribbon}</div></div><div class="skey">${key}</div></div>

// ---------- COGS per dose (drug product) or per device ----------
function pPharma() {
  const M = S.pharma, mode = M.mode, wage = S.labour.costPerOp / 2080, fx = S.basis.fx;
  const twoN = v => `${sig3(toShow(v))}<span class="alt">${sig3(toOther(v))} ${oc()}</span>`;
  const kp = (ic, lab, v, unit, sub, cls) => `<div class="kpi ${cls || ''}"><div class="l">${icon(ic)}<span>${lab}</span></div><div class="v">${v}<small>${unit}</small></div><div class="s">${sub}</div></div>`;
  const del = path => `<td><button class="btn sm" data-act="del" data-v="${path}" aria-label="Delete row">✕</button></td>`;
  const ribbonOf = (G, per, T, unit) => `<div class="srow"><span class="cap">Per ${unit}</span><div class="ribbon" role="img" aria-label="Cost build-up">${G.map(g => per[g[1]] > 0 ? `<a style="--g:${g[2]};flex:${per[g[1]] / T}" title="${g[0]}: ${sig3(toShow(per[g[1]]))} ${cur()}"></a>` : '').join('')}</div></div>
    <div class="skey">${G.map(g => `<a style="--g:${g[2]}"><i></i>${g[0]} <b>${sig3(per[g[1]] / T * 100)} %</b><span class="sv">${sig3(toShow(per[g[1]]))} ${cur()} · ${sig3(toOther(per[g[1]]))} ${oc()}</span></a>`).join('')}</div>`;
  const pnote = S.productType === 'pharma' ? '' : `<div class="banner">${icon('pharma')}<div>This page is built for <b>pharmaceutical products and devices</b>; the product type now is ${PRODUCTS[S.productType].t}. <a href="#start">Change it on Job and basis</a>.</div></div>`;
  const modeSeg = seg('pmode', mode, [['drug', 'Drug product, per dose'], ['device', 'Device, per unit']], 'COGS mode');
  let body;
  if (mode === 'drug') {
    const k = M.drug, P = 'pharma.drug', r = X.drugCalc(k, wage), T = Math.max(1e-12, r.perDose);
    const G = [['API', 'api', 'var(--c1)'], ['Excipients', 'exc', 'var(--c2)'], ['Formulation (labour + machine)', 'form', 'var(--c3)'], ['QC/QA release', 'qc', 'var(--c4)'],

   <tr><td>Ex-factory revenue</td><td class="num">${twoN(r.exFactory)}</td><td class="num">${mega(r.annual.revenue)}</td><td></td><td class="note">shelf ÷ (1 + VAT) × (1 − retailer) × (1 − distributor)</td></tr>
   <tr><td>Gross margin</td><td class="num ${dcls(-r.gross)}">${twoN(r.gross)}</td><td class="num">${mega(r.annual.gross)}</td><td></td><td class="note">${r.grossPct == null ? '' : sig3(r.grossPct * 100) + ' % of ex-factory'}</td></tr>
   <tr><td>Operating margin after selling and G&amp;A</td><td class="num ${dcls(-r.operating)}">${twoN(r.operating)}</td><td class="num">${mega(r.annual.operating)}</td><td></td><td class="note">${r.operatingPct == null ? '' : sig3(r.operatingPct * 100) + ' % of ex-factory'}</td></tr>
   </tbody></table></div><p class="note">Per-year values in M${cur()}/yr. Economics (next): revenue = market size × share with ramp-up over a 2–5 year product life, NPV including development (Cussler & Moggridge §5.4-3; Lecture 10 food-packaging cash flow).</p></div>`;
}

const RENDER = { pharma: pPharma, batch: pBatch, bom: pBom, unitprices: pUnitPrices, overview: pOverview, start: pStart, materials: pMaterials, utilities: pUtilities, labour: pLabour, waste: pWaste, com: pCom, compare: pCompare, catalyst: pCatalyst, report: pReport, sources: pSources };
function render() {
  recompute(); renderRail();
  const y = window.scrollY;
  $('#main').innerHTML = appbar() + `<div class="content">${RENDER[page()]()}</div>`;
  window.scrollTo(0, y);
  document.querySelectorAll('#openfile, .openfile').forEach(of => of.addEventListener('change', openFile));
}

// ---------- events ----------
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.p) {
    let v = t.value;
    if (t.type === 'number') v = v === '' ? 0 : Number(v);
    if (v === 'true') v = true; else if (v === 'false') v = false;
    setP(t.dataset.p, v);
    const m = t.dataset.p.match(/^utilities\.(\d+)\.type$/);
    if (m) { const u = S.utilities[+m[1]]; if (UUNIT[u.type]) { u.unit = UUNIT[u.type]; u.priceMode = 'derived'; } else u.priceMode = 'manual'; }
    if (t.dataset.p === 'util.elec.schedule') S.util.elec.voltage = Object.keys(D.elec.schedules[v].rows)[1];
    if (t.dataset.p === 'job' ) {}
    save(); render(); restoreFocus(t.id);
  } else if (t.dataset.mult) {
    const [k, f] = t.dataset.mult.split('.');
    S.mult[k] = S.mult[k] || {}; S.mult[k][f] = Number(t.value);
    save(); render(); restoreFocus(t.id);
  }
});
function restoreFocus(id) { const el = id && document.getElementById(id); if (el && el.focus) el.focus({ preventScroll: true }); }

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'menu') { $('#rail').classList.toggle('open'); return; }
  if (a === 'basisset') S.basisSet = v;
  if (a === 'show') S.basis.show = v;
  if (a === 'pmode') S.pharma.mode = v;
  if (a === 'paddx') S.pharma.drug.excipients.push({ name: 'Excipient', mg: 0, price: 0 });
  if (a === 'padds') S.pharma.device.steps.push({ name: 'Step', mat: 0, min: 0, sec: 0, rate: 0, yield: 100 });
  if (a === 'baddr') S.batch.recipe.push({ name: 'Material', kg: 0, price: 0 });
  if (a === 'baddu') S.batch.utils.push({ name: 'Utility', type: 'elec', qty: 0, price: 0 });
  if (a === 'badds') S.batch.steps.push({ name: 'Step', vessel: 'R-101', hours: 1, ops: 1 });
  if (a === 'bomsel') S.bom.sel = +v;
  if (a === 'bomadd') { S.bom.skus.push(Object.assign(skuDefault(), { name: 'New SKU', formula: [{ name: 'Ingredient', pct: 100, price: 0 }], pack: [{ name: 'Container', cost: 0, per: 1 }] })); S.bom.sel = S.bom.skus.length - 1; }
  if (a === 'bomdup') { const c = JSON.parse(JSON.stringify(S.bom.skus[S.bom.sel])); c.id = nid('k'); c.name += ' (copy)'; S.bom.skus.push(c); S.bom.sel = S.bom.skus.length - 1; }
  if (a === 'bomdel' && S.bom.skus.length > 1) { S.bom.skus.splice(S.bom.sel, 1); S.bom.sel = 0; }
  if (a === 'bomaddf') S.bom.skus[S.bom.sel].formula.push({ name: 'Ingredient', pct: 0, price: 0 });
  if (a === 'bomaddp') S.bom.skus[S.bom.sel].pack.push({ name: 'Packaging item', cost: 0, per: 1 });
  if (a === 'ptype') { S.productType = v; S.basis.life = PRODUCTS[v].life; toast(`${PRODUCTS[v].t}: project life set to ${PRODUCTS[v].life} years`); }
  if (a === 'job') {
    S.job = v;
    if (v === 'improve') { // seed project case from base where empty
      const seed = o => { if (o && o.q && o.q.project == null) o.q.project = o.q.base; };
      [...S.materials, ...S.utilities, ...S.waste].forEach(seed);
      if (S.fci.project == null) S.fci.project = S.fci.base;
    }
  }
  if (a === 'del') { const ks = v.split('.'); const i = +ks.pop(); getP(ks.join('.')).splice(i, 1); }
  if (a === 'norm') { NORM = v === '1'; render(); return; }
  if (a === 'addmat') S.materials.push({ id: nid('m'), name: 'New stream', role: 'feed', unit: 't/h', price: 0, q: { base: 0, project: 0 } });
  if (a === 'addutil') S.utilities.push({ id: nid('u'), name: 'New utility', type: 'elec', unit: 'kW', priceMode: 'derived', price: 0, q: { base: 0, project: 0 } });
  if (a === 'addstaff') S.labour.extra.push({ id: nid('x'), role: 'Engineer', cost: D.engineerCost, n: { base: 1, project: 1 } });
  if (a === 'addwaste') {
    const t = { haz: ['Hazardous waste', 't/yr', D.wasteHaz], non: ['Non-hazardous waste', 't/yr', D.wasteNonHaz], ww: ['Wastewater to estate', 'm3/h', D.wastewater] }[v];
    S.waste.push({ id: nid('w'), name: t[0], kind: v === 'non' ? 'non' : v, priceMode: 'derived', unit: t[1], price: t[2], q: { base: 0, project: 0 } });
  }
  if (a === 'resetmult') S.mult = {};
  if (a === 'addcatmat') S.cat.materials.push({ name: '', qty: 0, unit: 'kg', group: 'other', price: null });
  if (a === 'addcatstep') S.cat.steps.push({ step: 'Reactor, simple (mixing)', qty: 1 });
  if (a === 'catreset') S.cat = catDefault();
  if (a === 'catuse') {
    const r = catRun(); if (r.error) return;
    const tpy = S.cat.lifeYr > 0 ? S.cat.chargeKg / S.cat.lifeYr / 1000 : 0;
    S.materials.push({ id: nid('m'), name: `Catalyst change-outs: ${S.cat.name} (CatCost ${S.cat.basisYear})`, role: 'feed', unit: 't/yr', price: r.pricePerKg * S.basis.fx * 1000, q: { base: tpy, project: tpy } });
    toast('Added to Materials');
  }
  if (a === 'example') { S = example(); toast('Example loaded'); }
  if (a === 'blank') { S = blank(); toast('Blank project'); }
  if (a === 'savejson') { await download(fileBase() + '.opex.json', JSON.stringify(S, null, 1)); return; }
  if (a === 'csv') { await download(fileBase() + '_OPEX.csv', toCSV()); return; }
  if (a === 'copy') {
    try { await navigator.clipboard.writeText(toText()); toast('Summary copied'); } catch (err) { toast('Copy was blocked by the browser'); }
    return;
  }
  save(); render();
});
window.addEventListener('hashchange', () => { $('#rail').classList.remove('open'); render(); window.scrollTo(0, 0); });

function fileBase() { return (S.name || 'opex').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 60) || 'opex'; }
let DL = null;
async function download(name, data) {
  try {
    if (DL === null && window.claude && window.claude.use) DL = await window.claude.use('downloads');
    if (!DL) { toast('Saving files is not available here; use Copy summary'); return; }
    await DL.save({ filename: name, data });
    toast('Saved ' + name);
  } catch (err) { toast(err && err.code === 'declined' ? 'Save cancelled' : 'Could not save: ' + (err && (err.message || err.code) || err)); }
}
function toCSV() {
  const cs = cases(); const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const out = [['Section', 'Item', 'Unit', 'Price THB', ...cs.map(c => `${CASE_LABEL[c]} flow`), ...cs.map(c => `${CASE_LABEL[c]} THB/yr`)]];
  const add = (sec, list, arr, unitF, priceF) => list.forEach(x => out.push([sec, x.name || x.role, unitF(x), priceF(x), ...cs.map(c => x.q ? x.q[c] : ''), ...cs.map(c => R.res[c][arr].find(y => y.id === x.id).value.toFixed(0))]));
  add('Materials', S.materials, 'materials', x => x.unit, x => x.price);
  add('Utilities', S.utilities, 'utilities', x => x.unit, x => R.res.base.utilities.find(y => y.id === x.id).price.toFixed(4));
  add('Waste', S.waste, 'waste', x => x.unit, x => x.price);
  for (const r of summaryRows()) out.push(['Summary', r[0], 'THB/yr', '', ...cs.map(() => ''), ...r.slice(1).map(v => v.toFixed(0))]);
  const t = typeResult();
  if (t) { out.push([]); out.push(['Product type', t.P.t, t.name, t.qtyLab]); out.push(['Section', 'Item', `THB/${t.unit}`, 'THB/yr', `USD/${t.unit}`, 'USD/yr']);
    for (const g of t.parts) out.push([t.pageLab, g[0], (g[1] / t.perDiv).toFixed(4), g[1].toFixed(0), (g[1] / t.perDiv / S.basis.fx).toFixed(4), (g[1] / S.basis.fx).toFixed(0)]);
    out.push([t.pageLab, 'Cost of goods', t.perUnit.toFixed(4), t.annualCost.toFixed(0), (t.perUnit / S.basis.fx).toFixed(4), (t.annualCost / S.basis.fx).toFixed(0)]);
    out.push([t.pageLab, 'Sales', t.price.toFixed(4), t.revenue.toFixed(0), (t.price / S.basis.fx).toFixed(4), (t.revenue / S.basis.fx).toFixed(0)]); }
  return out.map(r => r.map(q).join(',')).join('\r\n');
}
function toText() {
  const cs = cases(), t = typeResult();
  if (t) return `${S.name}\n${t.P.t}: ${t.name}, ${t.qtyLab}\nCost of goods ${sig3(toShow(t.perUnit))} ${cur()}/${t.unit} (${sig3(toOther(t.perUnit))} ${oc()}); price ${sig3(toShow(t.price))} ${cur()}/${t.unit}; gross margin ${t.grossPct == null ? '-' : sig3(t.grossPct * 100) + ' %'}\nAnnual cost of goods ${sig3(toShow(t.annualCost) / 1e6)} M${cur()}/yr (${sig3(toOther(t.annualCost) / 1e6)} M${oc()})\n` + t.parts.map(g => `${g[0]}: ${sig3(toShow(g[1] / t.perDiv))} ${cur()}/${t.unit}, ${sig3(g[1] / t.annualCost * 100)} %`).join('\n');
  return `${S.name}\n${JOBS[S.job].t}, ${S.basis.hours} h/yr, prices ${D.asOf} excl. VAT\n` +
    summaryRows().map(r => `${r[0]}: ${r.slice(1).map(v => megaT(v)).join(' -> ')} M${cur()}/yr (${r.slice(1).map(v => sig3(toOther(v) / 1e6)).join(' -> ')} M${oc()}/yr)`).join('\n');
}
function openFile(e) {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { const s = JSON.parse(t); if (!s || s.v !== 1) throw new Error('not an OPEX Studio file'); S = normalize(s); save(); render(); toast('Opened ' + f.name); })
    .catch(err => toast('Could not open: ' + err.message));
}

render();
})();

</script>
